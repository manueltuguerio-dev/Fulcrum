<style>
  :root{
    --tinta:#111827; --tenue:#6b7280; --linea:#e5e7eb; --fondo:#f6f7f9; --panel:#fff;
    --marca:#1f3864; --marca-suave:#eef2f9;
    --rojo:#9c0006; --rojo-fondo:#ffc7ce; --verde:#166534; --verde-fondo:#dcfce7;
    --ambar:#92400e; --ambar-fondo:#fef3c7;
    --radio:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);
    font:14px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
  header{background:var(--marca);color:#fff;padding:13px 20px;display:flex;
    align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.2px}
  header span{font-size:12px;color:#b9c6e2}
  nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--linea);
    padding:0 20px;overflow-x:auto}
  nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;
    font:inherit;font-weight:500;color:var(--tenue);cursor:pointer;white-space:nowrap}
  nav button:hover{color:var(--tinta)}
  nav button[aria-selected=true]{color:var(--marca);border-bottom-color:var(--marca)}
  main{max-width:1100px;margin:0 auto;padding:18px}
  section[hidden]{display:none}
  .panel{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);
    padding:18px;margin-bottom:16px}
  .panel h2{margin:0 0 4px;font-size:15px}
  .ayuda{margin:0 0 14px;color:var(--tenue);font-size:13px}
  .nota{font-weight:400;color:var(--tenue);font-size:12px}
  .rejilla{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
  label.check{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13px;
    margin-top:10px;color:var(--tinta)}
  label.check input{margin-top:3px;flex-shrink:0}
  input[type=text],input[type=date],input[type=email],select,textarea{
    width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;font:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--marca);outline-offset:-1px;
    border-color:var(--marca)}
  textarea{resize:vertical;min-height:60px}
  .btn{background:var(--marca);color:#fff;border:0;border-radius:7px;padding:9px 16px;
    font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{filter:brightness(1.12)}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
  .btn.claro{background:#fff;color:var(--marca);border:1px solid #c7d2e5}
  .btn.claro:hover{background:var(--marca-suave);filter:none}
  .btn.chico{padding:5px 10px;font-size:12px}
  .acciones{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--linea);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--tenue);
    background:#fafbfc;position:sticky;top:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .desplaza{max-height:380px;overflow:auto;border:1px solid var(--linea);border-radius:8px}
  .marca{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .marca.rojo{background:var(--rojo-fondo);color:var(--rojo)}
  .marca.verde{background:var(--verde-fondo);color:var(--verde)}
  .marca.ambar{background:var(--ambar-fondo);color:var(--ambar)}
  .aviso{border-left:3px solid;padding:9px 13px;border-radius:0 7px 7px 0;margin-bottom:9px;font-size:13px}
  .aviso.err{background:#fef2f2;border-color:var(--rojo);color:#7f1d1d}
  .aviso.adv{background:var(--ambar-fondo);border-color:#d97706;color:var(--ambar)}
  .aviso.ok{background:var(--verde-fondo);border-color:#16a34a;color:var(--verde)}
  .aviso.info{background:var(--marca-suave);border-color:var(--marca);color:#1e3a5f}
  .cifras{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px}
  .cifra{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:13px}
  .cifra b{display:block;font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
  .cifra small{color:var(--tenue);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .cifra.alerta b{color:var(--rojo)}
  ol.pasos{margin:0;padding-left:0;list-style:none;counter-reset:p}
  ol.pasos li{counter-increment:p;padding:10px 0 10px 38px;position:relative;
    border-bottom:1px solid var(--linea);font-size:13px}
  ol.pasos li:last-child{border-bottom:0}
  ol.pasos li::before{content:counter(p);position:absolute;left:0;top:10px;width:24px;height:24px;
    background:var(--marca);color:#fff;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:700}
  ol.pasos b{display:block;margin-bottom:2px}
  .fila-radio{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .fila-radio label{display:flex;gap:7px;align-items:flex-start;font-weight:500;font-size:13px;
    margin:0;cursor:pointer;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;
    flex:1;min-width:230px}
  .fila-radio label:has(input:checked){border-color:var(--marca);background:var(--marca-suave)}
  .fila-radio input{margin-top:3px}
  .fila-radio small{display:block;color:var(--tenue);font-weight:400;margin-top:2px}
  .cargando{display:inline-block;width:14px;height:14px;border:2px solid #ffffff66;
    border-top-color:#fff;border-radius:50%;animation:giro .7s linear infinite;
    vertical-align:-3px;margin-right:6px}
  @keyframes giro{to{transform:rotate(360deg)}}
  code{background:#f1f3f5;padding:1px 5px;border-radius:4px;font-size:12px}
  details{border:1px solid var(--linea);border-radius:8px;padding:10px 13px;margin-top:12px;background:#fff}
  summary{cursor:pointer;font-weight:600;font-size:13px}
  .vacio{padding:24px;text-align:center;color:var(--tenue);font-size:13px}
  .previa{border:1px solid var(--linea);border-radius:8px;padding:12px;background:#fff;
    max-height:340px;overflow:auto}
  .barra{height:6px;background:var(--linea);border-radius:99px;overflow:hidden;margin-top:10px}
  .barra i{display:block;height:100%;background:var(--marca);transition:width .4s}
</style>
