<script>
/* TLTERMINALS · Almacén — cliente (SPA). Todo el DOM se arma aquí; la
   comunicación con el servidor pasa siempre por ejecutar(token, fn, args). */

var LLAVE_TOKEN = 'almacen-tlterminals-token';
var TOKEN = '';
try { TOKEN = window.localStorage.getItem(LLAVE_TOKEN) || ''; } catch (e) { TOKEN = ''; }

function guardarToken(t) {
  TOKEN = t || '';
  try {
    if (t) { window.localStorage.setItem(LLAVE_TOKEN, t); }
    else { window.localStorage.removeItem(LLAVE_TOKEN); }
  } catch (e) { /* modo privado: se queda solo en memoria */ }
}

var estado = {
  usuario: null, config: {}, catalogos: {}, camposCustom: [], empleados: [], maquinas: [],
  vivas: [], historial: [], vista: '', desfase: 0,
  loginModo: 'operativo', pinSel: null, pinBuffer: '',
  sel: { staff: [], maquinas: [] }
};

/* -------------------------------- utilidades ------------------------------- */

function $(id) { return document.getElementById(id) || nodoAusente(); }
function nodoAusente() {
  return { innerHTML: '', textContent: '', value: '', checked: false, disabled: false,
    files: null, style: {}, classList: { add: function(){}, remove: function(){}, contains: function(){return false;} },
    addEventListener: function(){}, insertAdjacentHTML: function(){}, focus: function(){}, querySelector: function(){return null;}, querySelectorAll: function(){return [];}, ausente: true };
}
function esc(t) {
  return String(t === null || t === undefined ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function llamar(nombre, args) {
  return new Promise(function (resolver, rechazar) {
    var c = google.script.run.withSuccessHandler(resolver).withFailureHandler(rechazar);
    if (typeof c.ejecutar !== 'function') { rechazar(new Error('No pude comunicarme con el servidor.')); return; }
    c.ejecutar(TOKEN, nombre, args || []);
  });
}
var tempAviso = null;
function avisar(msg, malo) {
  var caja = $('notificacion');
  caja.textContent = msg;
  caja.className = malo ? 'malo' : '';
  clearTimeout(tempAviso);
  tempAviso = setTimeout(function () { caja.classList.add('oculto'); }, malo ? 7000 : 3500);
  caja.classList.remove('oculto');
}
function fallo(err) { avisar(err && err.message ? err.message : 'Algo salió mal.', true); }
function val(id) { return $(id).value; }

function dosCifras(n) { return (n < 10 ? '0' : '') + n; }
function relojDesde(ms) {
  var s = Math.max(0, Math.floor(ms / 1000));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), seg = s % 60;
  return (h > 0 ? dosCifras(h) + ':' : '') + dosCifras(m) + ':' + dosCifras(seg);
}
function ahoraServidor() { return Date.now() + estado.desfase; }
function minutos(ms) { return Math.round(ms / 60000 * 100) / 100; }
function descargar(nombre, dataUrl) {
  var a = document.createElement('a'); a.href = dataUrl; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
}

/* --------------------------------- arranque -------------------------------- */

function arrancar() {
  llamar('apiEstadoApp').then(function (r) {
    $('cargando').classList.add('oculto');
    if (!r.sesion) { estado.operativos = r.operativos || []; mostrarLogin(); return; }
    aplicarEstado(r); mostrarApp();
  }).catch(function (err) {
    $('cargando').textContent = 'No pude cargar: ' + (err.message || err);
  });
}
function aplicarEstado(r) {
  estado.usuario = r.usuario;
  estado.config = r.config || {};
  estado.catalogos = r.catalogos || {};
  estado.camposCustom = r.camposCustom || [];
  estado.empleados = r.empleados || [];
  estado.maquinas = r.maquinas || [];
  estado.vivas = r.vivas || [];
  estado.historial = r.historial || [];
  estado.desfase = (r.serverNowMs || Date.now()) - Date.now();
}
function recargarBase() {
  return llamar('apiEstadoApp').then(function (r) { if (r.sesion) { aplicarEstado(r); } return r; });
}

/* ---------------------------------- login ---------------------------------- */

function mostrarLogin() {
  $('app').classList.add('oculto');
  var caja = $('login'); caja.classList.remove('oculto');
  var esOp = estado.loginModo === 'operativo';
  caja.innerHTML =
    '<div class="login"><div class="logo">ALMACÉN <span>TLTERMINALS</span></div>' +
    '<div class="caja"><div class="segmentos">' +
      '<button class="' + (esOp ? 'activa' : '') + '" onclick="cambiarLogin(\'operativo\')">Operativo · PIN</button>' +
      '<button class="' + (!esOp ? 'activa' : '') + '" onclick="cambiarLogin(\'clave\')">Supervisor</button>' +
    '</div>' + (esOp ? loginOperativoHTML() : loginClaveHTML()) + '</div></div>';
}
function cambiarLogin(modo) { estado.loginModo = modo; estado.pinSel = null; estado.pinBuffer = ''; mostrarLogin(); }
function loginOperativoHTML() {
  var ops = estado.operativos || [];
  if (estado.pinSel) {
    var op = ops.filter(function (o) { return o.id === estado.pinSel; })[0] || { nombre: '' };
    var puntos = '';
    for (var i = 0; i < 4; i++) { puntos += '<i class="' + (i < estado.pinBuffer.length ? 'lleno' : '') + '"></i>'; }
    var teclas = '';
    [1,2,3,4,5,6,7,8,9].forEach(function (n) { teclas += '<button onclick="tecla(\'' + n + '\')">' + n + '</button>'; });
    teclas += '<button onclick="tecla(\'x\')">←</button><button onclick="tecla(\'0\')">0</button><button onclick="tecla(\'ok\')">✓</button>';
    return '<div class="tarjeta"><div class="sub">Operador</div><h3>' + esc(op.nombre) + '</h3>' +
      '<div class="puntos">' + puntos + '</div><div class="teclado">' + teclas + '</div>' +
      '<div class="fila-botones"><button class="btn chico" onclick="estado.pinSel=null;estado.pinBuffer=\'\';mostrarLogin()">Cambiar de operador</button></div></div>';
  }
  if (!ops.length) { return '<div class="tarjeta vacio">Aún no hay operativos dados de alta.<br><span class="mini">Un supervisor debe crearlos.</span></div>'; }
  var botones = ops.map(function (o) { return '<button onclick="elegirOperador(\'' + o.id + '\')">' + esc(o.nombre) + '</button>'; }).join('');
  return '<div class="tarjeta"><div class="sub">Toca tu nombre</div><div class="operadores">' + botones + '</div></div>';
}
function elegirOperador(id) { estado.pinSel = id; estado.pinBuffer = ''; mostrarLogin(); }
function tecla(t) {
  if (t === 'x') { estado.pinBuffer = estado.pinBuffer.slice(0, -1); mostrarLogin(); return; }
  if (t === 'ok') { entrarPin(); return; }
  if (estado.pinBuffer.length < 4) { estado.pinBuffer += t; }
  if (estado.pinBuffer.length === 4) { entrarPin(); } else { mostrarLogin(); }
}
function entrarPin() {
  if (estado.pinBuffer.length !== 4) { return; }
  llamar('apiEntrarPin', [estado.pinSel, estado.pinBuffer]).then(function (r) {
    guardarToken(r.token); entrarOk();
  }).catch(function (err) { estado.pinBuffer = ''; mostrarLogin(); fallo(err); });
}
function loginClaveHTML() {
  return '<div class="tarjeta">' +
    '<label>Correo</label><input id="loginEmail" type="email" autocomplete="username" placeholder="tu@empresa.com" />' +
    '<label>Contraseña</label><input id="loginClave" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')entrarClave()" />' +
    '<div class="fila-botones"><button class="btn primario bloque" onclick="entrarClave()">Entrar</button></div>' +
    '<div class="mini" style="margin-top:10px">Master de fábrica: contraseña temporal <b>almacen</b>.</div></div>';
}
function entrarClave() {
  var email = $('loginEmail').value.trim(), clave = $('loginClave').value;
  if (!email || !clave) { avisar('Escribe correo y contraseña.', true); return; }
  llamar('apiEntrarClave', [email, clave]).then(function (r) { guardarToken(r.token); entrarOk(); }).catch(fallo);
}
function entrarOk() {
  llamar('apiEstadoApp').then(function (r) {
    if (!r.sesion) { mostrarLogin(); return; }
    $('login').classList.add('oculto'); aplicarEstado(r); mostrarApp();
  }).catch(fallo);
}
function salir() {
  llamar('apiSalir').then(function () {}).catch(function () {});
  guardarToken(''); estado.usuario = null; detenerTic(); $('app').classList.add('oculto');
  llamar('apiEstadoApp').then(function (r) { estado.operativos = r.operativos || []; mostrarLogin(); });
}

/* ----------------------------------- app ----------------------------------- */

function rol() { return estado.usuario ? estado.usuario.rol : ''; }
function esAdmin() { return rol() === 'ADMINISTRADOR' || rol() === 'MASTER'; }
function esMaster() { return rol() === 'MASTER'; }

function mostrarApp() {
  $('login').classList.add('oculto'); $('app').classList.remove('oculto');
  var u = estado.usuario;
  $('barra').innerHTML =
    '<div class="marca">ALMACÉN <span>TL</span></div>' +
    '<div class="quien"><b>' + esc(u.nombre) + '</b><span class="chip">' + esc(u.rol) + '</span> ' +
    '<button class="btn chico" style="margin-left:6px" onclick="salir()">Salir</button></div>';

  var tabs = [{ id: 'patio', txt: 'Patio' }, { id: 'prueba', txt: 'Prueba' }];
  if (esAdmin()) {
    tabs.push({ id: 'dashboard', txt: 'Tablero' });
    tabs.push({ id: 'historial', txt: 'Historial' });
    tabs.push({ id: 'personal', txt: 'Personal' });
    tabs.push({ id: 'equipos', txt: 'Equipos' });
    tabs.push({ id: 'sla', txt: 'SLA' });
    tabs.push({ id: 'catalogos', txt: 'Catálogos' });
  }
  if (esMaster()) {
    tabs.push({ id: 'reportes', txt: 'Reportes' });
    tabs.push({ id: 'usuarios', txt: 'Usuarios' });
    tabs.push({ id: 'campos', txt: 'Campos' });
    tabs.push({ id: 'auditoria', txt: 'Auditoría' });
    tabs.push({ id: 'ajustes', txt: 'Ajustes' });
  }
  if (!estado.vista || !tabs.some(function (t) { return t.id === estado.vista; })) { estado.vista = 'patio'; }
  $('tabs').innerHTML = tabs.map(function (t) {
    return '<button class="' + (estado.vista === t.id ? 'activa' : '') + '" onclick="ir(\'' + t.id + '\')">' + t.txt + '</button>';
  }).join('');
  pintar();
}
function ir(v) { estado.vista = v; mostrarApp(); }
function pintar() {
  detenerTic();
  var f = { patio: pintarPatio, prueba: pintarPrueba, dashboard: pintarDashboard, historial: pintarHistorial,
    personal: pintarPersonal, equipos: pintarEquipos, sla: pintarSla, catalogos: pintarCatalogos,
    reportes: pintarReportes, usuarios: pintarUsuarios, campos: pintarCampos,
    auditoria: pintarAuditoria, ajustes: pintarAjustes }[estado.vista];
  if (f) { f(); }
}

/* --------------------------------- patio ----------------------------------- */

var ETAPAS_TXT = { arribo: 'Recepción en patio', espera: 'Espera de andén', ejecucion: 'En maniobra', pausado: 'EN DEMORA' };
var SIGUIENTE_TXT = { arribo: 'Asignar andén', espera: 'Iniciar maniobra' };

function pintarPatio() {
  var html = '<div class="fila-botones" style="margin-bottom:14px">' +
    '<button class="btn primario" onclick="abrirIniciar()">＋ Iniciar maniobra</button>' +
    '<button class="btn chico" onclick="refrescarVivas()">↻ Actualizar</button></div>';
  if (!estado.vivas.length) {
    html += '<div class="tarjeta vacio">No hay maniobras en curso.<br><span class="mini">Inicia una para arrancar el cronómetro.</span></div>';
  } else {
    html += '<div id="lista-vivas">' + estado.vivas.map(tarjetaViva).join('') + '</div>';
  }
  $('vista').innerHTML = html;
  arrancarTic();
}
function tarjetaViva(r) {
  var pausado = r.estado === 'pausado';
  var acciones = '';
  if (SIGUIENTE_TXT[r.estado]) {
    acciones += '<button class="btn primario" onclick="avanzar(\'' + r.id + '\')">▶ ' + SIGUIENTE_TXT[r.estado] + '</button>';
  }
  acciones += pausado
    ? '<button class="btn verde" onclick="reanudar(\'' + r.id + '\')">▶ Reanudar</button>'
    : '<button class="btn ambar" onclick="abrirPausar(\'' + r.id + '\')">⏸ Demora</button>';
  acciones += '<button class="btn rojo" onclick="abrirFinalizar(\'' + r.id + '\')">■ Finalizar</button>';
  acciones += '<button class="btn chico" onclick="abrirFoto(\'' + r.id + '\')">📷</button>';
  acciones += '<button class="btn chico" onclick="clonar(\'' + r.id + '\')">⧉ Clonar</button>';

  var staff = (r.staff || []).map(function (s) { return esc(s.nombre); }).join(', ');
  var maq = (r.maquinas || []).map(function (m) { return esc(m.sku); }).join(', ');

  return '<div class="tarjeta maniobra-viva ' + (pausado ? 'borde-pausa' : 'borde-verde') + '"' +
    ' data-id="' + r.id + '" data-arribo="' + r.arriboMs + '" data-anden="' + r.andenMs + '"' +
    ' data-inicio="' + r.inicioMs + '" data-demora="' + r.demoraAcumMs + '" data-pausa="' + r.pausaAbiertaMs + '"' +
    ' data-estado="' + r.estado + '" data-obj="' + r.slaObjetivoMin + '" data-ambar="' + r.slaAmbarMin + '">' +
    '<div class="encab-maniobra"><span class="folio">' + esc(r.folio) + '</span>' +
    '<span class="cli">' + esc(r.cliente || 'Sin cliente') + '</span>' +
    (r.tipoManiobra ? '<span class="chip">' + esc(r.tipoManiobra) + '</span>' : '') +
    '<span class="semaforo" data-sem style="margin-left:auto"></span></div>' +
    '<div style="margin:8px 0 2px"><span class="chip" data-etapatxt>' + esc(ETAPAS_TXT[r.estado] || r.estado) + '</span>' +
    (pausado && r.pausas.length ? ' <span class="en-pausa">· ' + esc(r.pausas[r.pausas.length - 1].causa) + '</span>' : '') + '</div>' +
    '<div style="margin:8px 0"><span class="crono grande" data-crono>00:00</span></div>' +
    '<div class="metricas">' +
    '<div><span>Efectivo</span><b data-efectivo>—</b></div>' +
    '<div><span>Demora</span><b data-demoratxt>—</b></div>' +
    '<div><span>Recep./Espera/Ejec.</span><b data-subs>—</b></div>' +
    '<div><span>Objetivo SLA</span><b>' + esc(r.slaObjetivoMin) + ' min</b></div>' +
    '</div>' +
    (staff ? '<div class="mini">👷 ' + staff + '</div>' : '') +
    (maq ? '<div class="mini">🚜 ' + maq + '</div>' : '') +
    '<div class="fila-botones">' + acciones + '</div></div>';
}

var relojIntervalo = null;
function arrancarTic() { detenerTic(); ttic(); relojIntervalo = setInterval(ttic, 1000); }
function detenerTic() {
  if (relojIntervalo) { clearInterval(relojIntervalo); relojIntervalo = null; }
  if (typeof ticPrueba !== 'undefined' && ticPrueba) { clearInterval(ticPrueba); ticPrueba = null; }
}
function ttic() {
  var nodos = document.querySelectorAll('.maniobra-viva');
  var ahora = ahoraServidor();
  for (var i = 0; i < nodos.length; i++) {
    var n = nodos[i];
    var arribo = Number(n.getAttribute('data-arribo')) || ahora;
    var anden = Number(n.getAttribute('data-anden')) || 0;
    var inicio = Number(n.getAttribute('data-inicio')) || 0;
    var demora = Number(n.getAttribute('data-demora')) || 0;
    var pausa = Number(n.getAttribute('data-pausa')) || 0;
    var estadoN = n.getAttribute('data-estado');
    var pausado = estadoN === 'pausado';
    var obj = Number(n.getAttribute('data-obj')) || 0;
    var ambar = Number(n.getAttribute('data-ambar')) || 0;

    var demoraViva = demora + (pausado && pausa ? (ahora - pausa) : 0);
    var totalMs = ahora - arribo;
    var efectivoMs = Math.max(0, totalMs - demoraViva);
    var recepMs = anden ? (anden - arribo) : (estadoN === 'arribo' ? totalMs : 0);
    var esperaMs = anden ? (inicio ? (inicio - anden) : (ahora - anden)) : 0;
    if (estadoN === 'arribo') { esperaMs = 0; }
    var ejecMs = inicio ? Math.max(0, (ahora - inicio) - (demoraViva)) : 0;

    var poner = function (sel, txt) { var el = n.querySelector(sel); if (el) { el.textContent = txt; } };
    poner('[data-crono]', relojDesde(totalMs));
    poner('[data-efectivo]', relojDesde(efectivoMs));
    poner('[data-demoratxt]', relojDesde(demoraViva));
    poner('[data-subs]', relojDesde(Math.max(0, recepMs)) + ' / ' + relojDesde(Math.max(0, esperaMs)) + ' / ' + relojDesde(ejecMs));
    var sem = n.querySelector('[data-sem]');
    if (sem) {
      var min = minutos(totalMs);
      var cls = pausado ? 'rojo' : (min <= obj ? 'verde' : (min <= ambar ? 'ambar' : 'rojo'));
      sem.innerHTML = '<span class="luz ' + cls + '"></span>' + min.toFixed(1) + ' min';
    }
  }
}
function refrescarVivas() {
  llamar('apiVivas').then(function (r) {
    estado.desfase = (r.serverNowMs || Date.now()) - Date.now();
    estado.vivas = r.vivas || [];
    if (estado.vista === 'patio') { pintarPatio(); }
  }).catch(fallo);
}
function avanzar(id) {
  llamar('apiAvanzarEtapa', [id]).then(function (r) { reemplazarViva(r); if (estado.vista === 'patio') { pintarPatio(); } }).catch(fallo);
}
function reanudar(id) {
  llamar('apiReanudar', [id]).then(function (r) { reemplazarViva(r); if (estado.vista === 'patio') { pintarPatio(); } }).catch(fallo);
}
function reemplazarViva(r) {
  var hecho = false;
  estado.vivas = estado.vivas.map(function (x) { if (x.id === r.id) { hecho = true; return r; } return x; });
  if (!hecho && ['arribo','espera','ejecucion','pausado'].indexOf(r.estado) !== -1) { estado.vivas.unshift(r); }
}
</script>
<script>
/* Segunda parte: modal genérico, selección múltiple de cuadrilla/equipos,
   iniciar/clonar, demora, finalizar y fotos. */

function abrirModal(titulo, cuerpo, ancho) {
  var m = $('modal'); m.classList.remove('oculto');
  m.innerHTML = '<div class="telon" onclick="if(event.target===this)cerrarModal()">' +
    '<div class="modal" style="max-width:' + (ancho || 560) + 'px">' +
    '<button class="cerrar" onclick="cerrarModal()">×</button><h3>' + esc(titulo) + '</h3>' + cuerpo + '</div></div>';
}
function cerrarModal() { $('modal').classList.add('oculto'); $('modal').innerHTML = ''; }

function opcionesDe(tipo, seleccion, incluirVacio) {
  var lista = (estado.catalogos[tipo] || []);
  var html = incluirVacio ? '<option value="">—</option>' : '';
  lista.forEach(function (o) {
    html += '<option value="' + esc(o.valor) + '"' + (String(seleccion || '') === o.valor ? ' selected' : '') + '>' + esc(o.valor) + '</option>';
  });
  return html;
}

/* selección múltiple por chips */
function chipsHTML(grupo) {
  var items = grupo === 'staff'
    ? estado.empleados.map(function (e) { return { id: e.id, txt: e.nombre + ' · ' + e.puesto }; })
    : estado.maquinas.map(function (m) { return { id: m.id, txt: m.sku + (m.tipo ? ' · ' + m.tipo : '') }; });
  if (!items.length) { return '<div class="mini">Nada dado de alta todavía.</div>'; }
  var seleccion = estado.sel[grupo] || [];
  return '<div class="chips">' + items.map(function (it) {
    var sel = seleccion.indexOf(it.id) !== -1;
    return '<button type="button" class="chip-sel ' + (sel ? 'on' : '') + '" data-grp="' + grupo + '" data-id="' + it.id + '" onclick="toggleChip(this)">' + esc(it.txt) + '</button>';
  }).join('') + '</div>';
}
function toggleChip(el) {
  var grupo = el.getAttribute('data-grp'), id = el.getAttribute('data-id');
  var arr = estado.sel[grupo] || (estado.sel[grupo] = []);
  var i = arr.indexOf(id);
  if (i === -1) { arr.push(id); el.classList.add('on'); } else { arr.splice(i, 1); el.classList.remove('on'); }
}

function camposCustomHTML(valores) {
  valores = valores || {};
  if (!estado.camposCustom.length) { return ''; }
  return estado.camposCustom.map(function (c) {
    var v = valores[c.clave] === undefined ? '' : valores[c.clave];
    var campo;
    if (c.tipo === 'numero') { campo = '<input type="number" data-cc="' + c.clave + '" value="' + esc(v) + '" />'; }
    else if (c.tipo === 'siNo') { campo = '<select data-cc="' + c.clave + '"><option value="NO"' + (esc(v) === 'SI' ? '' : ' selected') + '>No</option><option value="SI"' + (esc(v) === 'SI' ? ' selected' : '') + '>Sí</option></select>'; }
    else if (c.tipo === 'lista') {
      var ops = (c.opciones || []).map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('');
      campo = '<select data-cc="' + c.clave + '"><option value="">—</option>' + ops + '</select>';
    } else { campo = '<input type="text" data-cc="' + c.clave + '" value="' + esc(v) + '" />'; }
    return '<div class="ancho"><label>' + esc(c.etiqueta) + '</label>' + campo + '</div>';
  }).join('');
}
function leerCamposCustom(cont) {
  var res = {};
  (cont || document).querySelectorAll('[data-cc]').forEach(function (el) {
    if (el.value !== '' && el.value !== null) { res[el.getAttribute('data-cc')] = el.value; }
  });
  return res;
}

/* opciones para selects reutilizables */
function opcionesManiobra(seleccion) {
  return (estado.catalogos.tiposManiobra || []).map(function (o) {
    return '<option value="' + esc(o.valor) + '"' + (String(seleccion || '') === o.valor ? ' selected' : '') + '>' + esc(o.valor) + '</option>';
  }).join('');
}
function opcionesOperador(seleccion) {
  var ops = estado.empleados.filter(function (e) { return e.puesto === 'Montacarguista'; });
  return '<option value="">Operador…</option>' + ops.map(function (e) {
    return '<option value="' + e.id + '"' + (String(seleccion || '') === e.id ? ' selected' : '') + '>' + esc(e.nombre) + '</option>';
  }).join('');
}
function opcionesAditamento(seleccion) {
  return (estado.catalogos.aditamentos || []).map(function (o) {
    return '<option value="' + esc(o.valor) + '"' + (String(seleccion || '') === o.valor ? ' selected' : '') + '>' + esc(o.valor) + '</option>';
  }).join('');
}

/* Selección de montacargas con operador y aditamento por SKU. */
function maquinasPickerHTML(preseleccion) {
  preseleccion = preseleccion || [];
  var porId = {}; preseleccion.forEach(function (m) { porId[m.id] = m; });
  if (!estado.maquinas.length) { return '<div class="mini">No hay equipos dados de alta.</div>'; }
  return estado.maquinas.map(function (m) {
    var sel = porId[m.id];
    return '<div class="maq-row" data-id="' + m.id + '">' +
      '<label class="maq-chk-l"><input type="checkbox" class="maq-chk"' + (sel ? ' checked' : '') + ' /> ' + esc(m.sku) + (m.tipo ? ' · ' + esc(m.tipo) : '') + '</label>' +
      '<select class="maq-op">' + opcionesOperador(sel ? sel.operadorId : '') + '</select>' +
      '<select class="maq-ad">' + opcionesAditamento(sel ? sel.aditamento : '') + '</select>' +
      '</div>';
  }).join('');
}
function leerMaquinas(cont) {
  var res = [];
  (cont || document).querySelectorAll('.maq-row').forEach(function (row) {
    var chk = row.querySelector('.maq-chk');
    if (chk && chk.checked) {
      res.push({ id: row.getAttribute('data-id'),
        operadorId: row.querySelector('.maq-op').value,
        aditamento: row.querySelector('.maq-ad').value });
    }
  });
  return res;
}

/* -------------------------------- iniciar / clonar ------------------------- */

function abrirIniciar(prefill) {
  prefill = prefill || {};
  estado.sel = { staff: (prefill.staff || []).map(function (s) { return s.id; }) };
  var g = function (k) { return prefill[k] === undefined ? '' : prefill[k]; };
  var esPlat = g('tipoManiobra') === (estado.config.maniobraPlataforma || '');
  var cuerpo = '<div class="rejilla">' +
    '<div><label>ID de furgón *</label><input id="f_furgonId" value="' + esc(g('furgonId')) + '" placeholder="TBOX667792" oninput="this.value=this.value.toUpperCase()" /></div>' +
    '<div><label>Tipo de maniobra *</label><select id="f_tipoManiobra" onchange="togglePlataforma()"><option value="">Elige…</option>' + opcionesManiobra(g('tipoManiobra')) + '</select></div>' +
    '<div><label>Cliente</label><select id="f_cliente">' + opcionesDe('clientes', g('cliente'), true) + '</select></div>' +
    '<div><label>Turno</label><select id="f_turno">' + opcionesDe('turnos', g('turno'), true) + '</select></div>' +
    '<div><label>Flujo</label><select id="f_flujo">' + opcionesDe('flujos', g('flujo'), true) + '</select></div>' +
    '<div><label>Etapa</label><select id="f_etapa">' + opcionesDe('etapas', g('etapa'), true) + '</select></div>' +
    '<div><label>Tipo de equipo</label><select id="f_tipoEquipo">' + opcionesDe('tiposEquipo', g('tipoEquipo'), true) + '</select></div>' +
    '<div><label>No. de unidad</label><input id="f_noUnidad" value="' + esc(g('noUnidad')) + '" /></div>' +
    '<div><label>Material</label><select id="f_material">' + opcionesDe('materiales', g('material'), true) + '</select></div>' +
    '<div><label>Presentación</label><select id="f_presentacion">' + opcionesDe('presentaciones', g('presentacion'), true) + '</select></div>' +
    '<div><label>Cant. piezas</label><input id="f_cantPiezas" type="number" inputmode="numeric" value="' + esc(g('cantPiezas')) + '" /></div>' +
    '<div><label>Tarimas</label><input id="f_tarimas" type="number" value="' + esc(g('tarimas')) + '" /></div>' +
    '<div><label>Peso (tons)</label><input id="f_pesoTons" type="number" step="0.01" value="' + esc(g('pesoTons')) + '" /></div>' +
    '<div><label>Daño al llegar</label><select id="f_danoLlegada"><option value="NO">No</option><option value="SI">Sí</option></select></div>' +
    '</div>' +
    '<div id="bloquePlataforma" class="rejilla' + (esPlat ? '' : ' oculto') + '" style="margin-top:6px">' +
      '<div class="ancho mini">Datos de carga a plataforma:</div>' +
      '<div><label>Placa / plataforma</label><input id="f_placaPlataforma" value="' + esc(g('placaPlataforma')) + '" /></div>' +
      '<div><label>Transportista</label><select id="f_transportista">' + opcionesDe('transportistas', g('transportista'), true) + '</select></div>' +
      '<div><label>Peso cargado</label><input id="f_pesoCargado" type="number" step="0.01" value="' + esc(g('pesoCargado')) + '" /></div>' +
    '</div>' +
    '<div class="rejilla">' +
      '<div class="ancho"><label>Cuadrilla (ayudantes / inspector / supervisor)</label>' + chipsHTML('staff') + '</div>' +
      '<div class="ancho"><label>Montacargas · operador · aditamento</label>' + maquinasPickerHTML(prefill.maquinas) + '</div>' +
      camposCustomHTML(prefill.campos) +
      '<div class="ancho"><label>Observaciones</label><textarea id="f_observaciones">' + esc(g('observaciones')) + '</textarea></div>' +
    '</div>' +
    '<label style="margin-top:10px"><input type="checkbox" id="f_directo" style="width:auto;margin-right:6px" />Empezar directo en “maniobra” (sin cronometrar recepción/espera)</label>' +
    '<div class="fila-botones"><button class="btn verde bloque" onclick="iniciar()">▶ Iniciar cronómetro</button></div>';
  abrirModal(prefill.furgonId ? 'Agregar evento al furgón ' + esc(prefill.furgonId) : 'Nuevo evento de maniobra', cuerpo, 640);
}
function togglePlataforma() {
  var esPlat = val('f_tipoManiobra') === (estado.config.maniobraPlataforma || '');
  $('bloquePlataforma').classList[esPlat ? 'remove' : 'add']('oculto');
}
function iniciar() {
  if (!val('f_furgonId').trim()) { avisar('Escribe el ID de furgón.', true); return; }
  if (!val('f_tipoManiobra')) { avisar('Elige el tipo de maniobra.', true); return; }
  var datos = {
    furgonId: val('f_furgonId'), tipoManiobra: val('f_tipoManiobra'),
    cliente: val('f_cliente'), turno: val('f_turno'), flujo: val('f_flujo'),
    etapa: val('f_etapa'), tipoEquipo: val('f_tipoEquipo'), noUnidad: val('f_noUnidad'),
    material: val('f_material'), presentacion: val('f_presentacion'), cantPiezas: val('f_cantPiezas'),
    tarimas: val('f_tarimas'), pesoTons: val('f_pesoTons'), danoLlegada: val('f_danoLlegada'),
    placaPlataforma: val('f_placaPlataforma'), transportista: val('f_transportista'), pesoCargado: val('f_pesoCargado'),
    observaciones: val('f_observaciones'),
    staffIds: estado.sel.staff, maquinas: leerMaquinas($('modal')),
    arrancarEjecucion: $('f_directo').checked,
    campos: leerCamposCustom($('modal'))
  };
  llamar('apiIniciar', [datos]).then(function (r) {
    estado.vivas.unshift(r); cerrarModal(); avisar('Evento ' + r.folio + ' iniciado.');
    estado.vista = 'patio'; mostrarApp();
  }).catch(fallo);
}
function clonar(id) {
  var r = estado.vivas.concat(estado.historial).filter(function (x) { return x.id === id; })[0];
  if (!r) { return; }
  abrirIniciar({ furgonId: r.furgonId, tipoManiobra: r.tipoManiobra, cliente: r.cliente, turno: r.turno,
    flujo: r.flujo, etapa: r.etapa, tipoEquipo: r.tipoEquipo, noUnidad: r.noUnidad, material: r.material,
    presentacion: r.presentacion, cantPiezas: r.cantPiezas, tarimas: r.tarimas, pesoTons: r.pesoTons,
    placaPlataforma: r.placaPlataforma, transportista: r.transportista, pesoCargado: r.pesoCargado,
    staff: r.staff, maquinas: r.maquinas, campos: r.campos });
}

/* -------------------------------- demora ----------------------------------- */

function abrirPausar(id) {
  var ops = (estado.catalogos.causasDemora || []).map(function (o) {
    return '<button class="btn bloque" style="margin-bottom:8px;text-align:left" onclick="pausar(\'' + id + '\',\'' + esc(o.valor) + '\')">' + esc(o.valor) + '</button>';
  }).join('');
  var cuerpo = '<div class="sub">Elige la causa de la demora (lista cerrada, obligatoria).</div>' +
    (ops || '<div class="mini">No hay causas de demora en el catálogo. Pídele a un administrador que las agregue.</div>');
  abrirModal('Demora', cuerpo);
}
function pausar(id, causa) {
  if (!causa || !String(causa).trim()) { avisar('Indica la causa de la demora.', true); return; }
  llamar('apiPausar', [id, causa]).then(function (r) { reemplazarViva(r); cerrarModal(); if (estado.vista === 'patio') { pintarPatio(); } }).catch(fallo);
}

/* ------------------------------- finalizar --------------------------------- */

function abrirFinalizar(id) {
  var r = estado.vivas.filter(function (x) { return x.id === id; })[0] || {};
  var cuerpo = '<div class="rejilla">' +
    '<div><label>Cant. piezas</label><input id="c_cantPiezas" type="number" value="' + esc(r.cantPiezas) + '" /></div>' +
    '<div><label>Tarimas</label><input id="c_tarimas" type="number" value="' + esc(r.tarimas) + '" /></div>' +
    '<div><label>Peso (tons)</label><input id="c_pesoTons" type="number" step="0.01" value="' + esc(r.pesoTons) + '" /></div>' +
    '<div><label>Unidad de medida</label><select id="c_unidadMedida">' + opcionesDe('unidadesMedida', r.unidadMedida, true) + '</select></div>' +
    '<div><label>Daño en maniobra</label><select id="c_danoManiobra"><option value="NO">No</option><option value="SI"' + (r.danoManiobra ? ' selected' : '') + '>Sí</option></select></div>' +
    '<div class="ancho"><label>Observaciones</label><textarea id="c_observaciones">' + esc(r.observaciones) + '</textarea></div>' +
    '<div class="ancho"><label>Detalle del daño / notas</label><textarea id="c_detalleDano">' + esc(r.detalleDano) + '</textarea></div>' +
    camposCustomHTML(r.campos) + '</div>' +
    '<div class="mini">Se calcularán recepción, espera, ejecución, total, demora, efectivo y min/pieza.</div>' +
    '<div class="fila-botones"><button class="btn rojo bloque" onclick="finalizar(\'' + id + '\')">■ Finalizar y calcular</button></div>';
  abrirModal('Cerrar maniobra ' + (r.folio || ''), cuerpo);
}
function finalizar(id) {
  var datos = { cantPiezas: val('c_cantPiezas'), tarimas: val('c_tarimas'), pesoTons: val('c_pesoTons'),
    unidadMedida: val('c_unidadMedida'), danoManiobra: val('c_danoManiobra'),
    observaciones: val('c_observaciones'), detalleDano: val('c_detalleDano'), campos: leerCamposCustom($('modal')) };
  llamar('apiFinalizar', [id, datos]).then(function (r) {
    estado.vivas = estado.vivas.filter(function (x) { return x.id !== id; });
    if (esAdmin()) { estado.historial.unshift(r); }
    cerrarModal(); pintar();
    // UX de flujo secuencial: seguir con otro evento del mismo furgón.
    var cuerpo = '<div class="sub">Evento <b>' + esc(r.folio) + '</b> cerrado · ' + esc(r.tiempoTotalMin) + ' min ' +
      '<span class="etiq ' + esc(r.sla) + '">' + esc(r.sla) + '</span></div>' +
      '<div class="fila-botones"><button class="btn primario bloque" onclick="agregarEventoMismoFurgon(\'' + esc(r.furgonId) + '\')">＋ Agregar evento a este mismo furgón</button>' +
      '<button class="btn bloque" onclick="cerrarModal()">Listo</button></div>';
    abrirModal('Maniobra cerrada', cuerpo);
  }).catch(fallo);
}
function agregarEventoMismoFurgon(furgonId) { cerrarModal(); abrirIniciar({ furgonId: furgonId }); }

/* --------------------------------- fotos ----------------------------------- */

function abrirFoto(id) {
  var cuerpo = '<div class="sub">Toma o elige una foto de la carga o del daño.</div>' +
    '<label>Etiqueta</label><select id="foto_etiqueta"><option value="carga">Carga</option><option value="daño">Daño</option><option value="documento">Documento</option></select>' +
    '<label>Foto</label><input id="foto_input" type="file" accept="image/*" capture="environment" />' +
    '<div class="fila-botones"><button class="btn primario bloque" onclick="subirFoto(\'' + id + '\')">📷 Subir a Drive</button></div>';
  abrirModal('Foto de la maniobra', cuerpo);
}
function subirFoto(id) {
  var input = $('foto_input');
  if (!input.files || !input.files.length) { avisar('Elige una foto.', true); return; }
  var archivo = input.files[0], lector = new FileReader();
  lector.onload = function () {
    avisar('Subiendo foto…');
    llamar('apiSubirFoto', [id, { nombre: archivo.name, tipo: archivo.type, dataUrl: lector.result }, val('foto_etiqueta')])
      .then(function () { cerrarModal(); avisar('Foto guardada en Drive.'); }).catch(fallo);
  };
  lector.readAsDataURL(archivo);
}
</script>
<script>
/* Tercera parte: tablero, historial + exportación, ver/editar/eliminar
   maniobra, catálogos, personal, equipos y matriz de SLA. */

/* --------------------------------- tablero --------------------------------- */

function pintarDashboard() {
  var cab = '<div class="tarjeta"><div class="rejilla">' +
    '<div><label>Desde</label><input id="db_desde" type="date" /></div>' +
    '<div><label>Hasta</label><input id="db_hasta" type="date" /></div>' +
    '<div style="display:flex;align-items:flex-end"><button class="btn primario bloque" onclick="cargarDashboard()">Actualizar</button></div>' +
    '<div style="display:flex;align-items:flex-end;gap:6px"><button class="btn chico" onclick="exportar(\'xlsx\')">⬇ Excel</button><button class="btn chico" onclick="exportar(\'pdf\')">⬇ PDF</button></div>' +
    '</div></div><div id="db_cuerpo"><div class="vacio">Cargando…</div></div>';
  $('vista').innerHTML = cab;
  cargarDashboard();
}
function cargarDashboard() {
  llamar('apiDashboard', [val('db_desde'), val('db_hasta')]).then(function (d) {
    var tile = function (et, v, cls) { return '<div class="kpi ' + (cls || '') + '"><span>' + et + '</span><b>' + v + '</b></div>'; };
    var html = '<div class="kpis">' +
      tile('Maniobras', d.total) +
      tile('Cumplimiento SLA', d.cumplimiento + '%', d.cumplimiento >= 80 ? 'verde' : (d.cumplimiento >= 50 ? 'ambar' : 'rojo')) +
      tile('Prom. total (min)', d.promTotal) +
      tile('Prom. efectivo (min)', d.promEfectivo) +
      tile('Demora total (min)', d.demoraTotal) +
      tile('Prom. min/pieza', d.promMinPieza) +
      tile('Con daño', d.conDano) +
      '</div>';

    html += '<div class="rejilla">';
    html += '<div class="tarjeta"><h3>Semáforo SLA</h3>' +
      '<div class="metricas"><div class="semaforo"><span class="luz verde"></span> ' + d.sla.verde + '</div>' +
      '<div class="semaforo"><span class="luz ambar"></span> ' + d.sla.ambar + '</div>' +
      '<div class="semaforo"><span class="luz rojo"></span> ' + d.sla.rojo + '</div></div>' + barras_(d.sla) + '</div>';

    html += '<div class="tarjeta"><h3>Demoras por causa</h3>' + listaBarras_(d.topCausas, 'causa', 'n') + '</div>';
    html += '<div class="tarjeta"><h3>Productividad por operador</h3>' +
      (d.operadores.length ? '<div class="tabla-scroll"><table><thead><tr><th>Operador</th><th>Maniobras</th><th>Min/pza</th></tr></thead><tbody>' +
      d.operadores.map(function (o) { return '<tr><td>' + esc(o.operador) + '</td><td>' + o.maniobras + '</td><td>' + esc(o.minPorPieza) + '</td></tr>'; }).join('') +
      '</tbody></table></div>' : '<div class="mini">Sin datos.</div>') + '</div>';
    html += '<div class="tarjeta"><h3>Uso de maquinaria (SKU)</h3>' + listaBarras_(d.maquinas, 'sku', 'n') + '</div>';
    html += '<div class="tarjeta"><h3>Volumen por día</h3>' + listaBarras_(d.dias, 'fecha', 'n') + '</div>';
    html += '</div>';
    $('db_cuerpo').innerHTML = html;
  }).catch(fallo);
}
function barras_(sla) {
  var total = (sla.verde + sla.ambar + sla.rojo) || 1;
  return '<div class="barra-sla">' +
    '<span class="seg verde" style="width:' + (sla.verde / total * 100) + '%"></span>' +
    '<span class="seg ambar" style="width:' + (sla.ambar / total * 100) + '%"></span>' +
    '<span class="seg rojo" style="width:' + (sla.rojo / total * 100) + '%"></span></div>';
}
function listaBarras_(items, campo, num) {
  if (!items || !items.length) { return '<div class="mini">Sin datos.</div>'; }
  var max = items.reduce(function (m, it) { return Math.max(m, it[num]); }, 1);
  return items.map(function (it) {
    return '<div class="barra-fila"><span class="barra-et">' + esc(it[campo]) + '</span>' +
      '<span class="barra-track"><span class="barra-val" style="width:' + (it[num] / max * 100) + '%"></span></span>' +
      '<span class="barra-n">' + it[num] + '</span></div>';
  }).join('');
}
function exportar(formato) {
  avisar('Generando ' + formato.toUpperCase() + '…');
  llamar('apiExportar', [formato, val('db_desde') || val('h_desde'), val('db_hasta') || val('h_hasta'), val('h_cliente')]).then(function (a) {
    descargar(a.nombre, a.dataUrl); avisar('Descarga lista.');
  }).catch(fallo);
}

/* ------------------------------- historial --------------------------------- */

function pintarHistorial() {
  var cab = '<div class="tarjeta"><div class="rejilla">' +
    '<div><label>Desde</label><input id="h_desde" type="date" /></div>' +
    '<div><label>Hasta</label><input id="h_hasta" type="date" /></div>' +
    '<div><label>Cliente</label><input id="h_cliente" /></div>' +
    '<div style="display:flex;align-items:flex-end;gap:6px"><button class="btn primario" onclick="buscarHistorial()">Buscar</button>' +
    '<button class="btn chico" onclick="exportar(\'xlsx\')">⬇ Excel</button><button class="btn chico" onclick="exportar(\'pdf\')">⬇ PDF</button></div>' +
    '</div></div><div id="tabla-hist">' + tablaHistorial(estado.historial) + '</div>';
  $('vista').innerHTML = cab;
}
function tablaHistorial(filas) {
  if (!filas.length) { return '<div class="tarjeta vacio">Sin maniobras finalizadas.</div>'; }
  var f = filas.map(function (r) {
    return '<tr onclick="verManiobra(\'' + r.id + '\')" style="cursor:pointer">' +
      '<td>' + esc(r.folio) + '</td><td>' + esc(r.fecha) + '</td><td>' + esc(r.cliente) + '</td>' +
      '<td>' + esc(r.flujo) + '</td><td>' + esc(r.cantPiezas) + '</td>' +
      '<td>' + esc(r.tiempoTotalMin) + '</td><td>' + esc(r.demoraMin) + '</td><td>' + esc(r.minPorPieza) + '</td>' +
      '<td><span class="etiq ' + esc(r.sla) + '">' + esc(r.sla || '') + '</span></td></tr>';
  }).join('');
  return '<div class="tarjeta tabla-scroll"><table><thead><tr>' +
    '<th>Folio</th><th>Fecha</th><th>Cliente</th><th>Flujo</th><th>Piezas</th><th>Total</th><th>Demora</th><th>Min/pza</th><th>SLA</th>' +
    '</tr></thead><tbody>' + f + '</tbody></table></div>';
}
function buscarHistorial() {
  llamar('apiHistorial', [val('h_desde'), val('h_hasta'), val('h_cliente')]).then(function (filas) {
    estado.historial = filas; $('tabla-hist').innerHTML = tablaHistorial(filas);
  }).catch(fallo);
}

function verManiobra(id) {
  var r = estado.historial.filter(function (x) { return x.id === id; })[0];
  if (!r) { return; }
  var adm = esAdmin();
  estado.sel = { staff: (r.staff || []).map(function (s) { return s.id; }) };
  var campo = function (et, v, id2, tipo) {
    return '<div><label>' + et + '</label>' + (adm ? '<input id="' + id2 + '" ' + (tipo === 'num' ? 'type="number" step="0.01"' : '') + ' value="' + esc(v) + '" />' : '<b>' + esc(v || '—') + '</b>') + '</div>';
  };
  var esPlat = r.tipoManiobra === (estado.config.maniobraPlataforma || '');
  var cuerpo = '<div class="rejilla">' +
    campo('Folio', r.folio, 'e_folio') + campo('ID furgón', r.furgonId, 'e_furgonId') +
    '<div><label>Tipo de maniobra</label>' + (adm ? '<select id="e_tipoManiobra"><option value="">—</option>' + opcionesManiobra(r.tipoManiobra) + '</select>' : '<b>' + esc(r.tipoManiobra || '—') + '</b>') + '</div>' +
    campo('Cliente', r.cliente, 'e_cliente') +
    campo('Flujo', r.flujo, 'e_flujo') + campo('Etapa', r.etapa, 'e_etapa') +
    campo('Material', r.material, 'e_material') + campo('Piezas', r.cantPiezas, 'e_cantPiezas', 'num') +
    campo('Tarimas', r.tarimas, 'e_tarimas', 'num') + campo('Peso (tons)', r.pesoTons, 'e_pesoTons', 'num') +
    (esPlat ? campo('Placa/plataforma', r.placaPlataforma, 'e_placaPlataforma') +
      campo('Transportista', r.transportista, 'e_transportista') +
      campo('Peso cargado', r.pesoCargado, 'e_pesoCargado', 'num') : '') +
    campo('Recepción (min)', r.tiempoRecepcionMin, 'e_tiempoRecepcionMin', 'num') +
    campo('Espera (min)', r.tiempoEsperaMin, 'e_tiempoEsperaMin', 'num') +
    campo('Ejecución (min)', r.tiempoEjecucionMin, 'e_tiempoEjecucionMin', 'num') +
    campo('Total (min)', r.tiempoTotalMin, 'e_tiempoTotalMin', 'num') +
    campo('Demora (min)', r.demoraMin, 'e_demoraMin', 'num') +
    campo('Efectivo (min)', r.tiempoEfectivoMin, 'e_tiempoEfectivoMin', 'num') +
    '<div class="ancho"><label>Causa de demora</label>' + (adm ? '<input id="e_causaDemora" value="' + esc(r.causaDemora) + '" />' : '<b>' + esc(r.causaDemora || '—') + '</b>') + '</div>' +
    (adm ? '<div class="ancho"><label>Cuadrilla</label>' + chipsHTML('staff') + '</div><div class="ancho"><label>Montacargas · operador · aditamento</label>' + maquinasPickerHTML(r.maquinas) + '</div>'
         : '<div class="ancho mini">👷 ' + esc((r.staff || []).map(function (s) { return s.nombre; }).join(', ')) + '<br>🚜 ' + esc((r.maquinas || []).map(function (m) { return m.sku + (m.operador ? ' (' + m.operador + ')' : ''); }).join(', ')) + '</div>') +

<script>

   ajustes (perfil MASTER en su mayoría). */

/* ------------------------------ reportes correo ---------------------------- */

function pintarReportes() {
  llamar('apiReportes').then(function (r) {
    estado._reportes = r.reportes;
    var filas = r.reportes.map(function (x) {
      return '<tr><td>' + esc(x.nombre) + '</td><td>' + esc(x.frecuencia) + '</td><td>' + esc(x.hora) + ':00</td>' +
        '<td class="mini">' + esc(x.destinatarios) + '</td><td>' + esc(x.formato) + '</td>' +

        '<td><button class="btn chico" onclick="editarReporte(\'' + x.id + '\')">Editar</button> ' +
        '<button class="btn chico" onclick="enviarReporte(\'' + x.id + '\')">Enviar</button> ' +
        '<button class="btn chico" onclick="borrarReporte(\'' + x.id + '\')">Borrar</button></td></tr>';
    }).join('');
    var aviso = r.disparadorActivo ? '<span class="etiq verde">disparador activo</span>'
      : '<span class="etiq ambar">sin disparador — se instala al guardar un reporte</span>';

      '<div class="fila-botones"><button class="btn primario" onclick="editarReporte()">＋ Nuevo reporte</button></div></div>' +
      '<div class="tarjeta tabla-scroll"><table><thead><tr><th>Nombre</th><th>Frecuencia</th><th>Hora</th><th>Destinatarios</th><th>Formato</th><th>Estado</th><th></th></tr></thead><tbody>' +
      (filas || '<tr><td colspan="7" class="mini">Sin reportes programados.</td></tr>') + '</tbody></table></div>';
  }).catch(fallo);
}
function editarReporte(id) {
  var x = id ? (estado._reportes || []).filter(function (r) { return r.id === id; })[0] : null;
  x = x || { nombre: '', frecuencia: 'diario', diaSemana: '1', hora: '07', destinatarios: '', formato: 'xlsx' };
  var freqs = ['diario', 'semanal', 'mensual'].map(function (f) { return '<option' + (x.frecuencia === f ? ' selected' : '') + '>' + f + '</option>'; }).join('');
  var dias = ['0','1','2','3','4','5','6'];
  var nom = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var diasHtml = dias.map(function (d, i) { return '<option value="' + d + '"' + (String(x.diaSemana) === d ? ' selected' : '') + '>' + nom[i] + '</option>'; }).join('');
  var cuerpo = '<div class="rejilla">' +
    '<div class="ancho"><label>Nombre</label><input id="r_nombre" value="' + esc(x.nombre) + '" /></div>' +
    '<div><label>Frecuencia</label><select id="r_frecuencia">' + freqs + '</select></div>' +
    '<div><label>Día (si es semanal)</label><select id="r_dia">' + diasHtml + '</select></div>' +
    '<div><label>Hora (0–23)</label><input id="r_hora" type="number" min="0" max="23" value="' + esc(Number(x.hora)) + '" /></div>' +
    '<div><label>Formato</label><select id="r_formato"><option value="xlsx"' + (x.formato === 'xlsx' ? ' selected' : '') + '>Excel</option><option value="pdf"' + (x.formato === 'pdf' ? ' selected' : '') + '>PDF</option></select></div>' +
    '<div class="ancho"><label>Destinatarios (correos separados por coma)</label><input id="r_dest" value="' + esc(x.destinatarios) + '" /></div>' +
    '</div><input type="hidden" id="r_id" value="' + esc(id || '') + '" />' +
    '<div class="mini">Diario = día anterior · Semanal = últimos 7 días · Mensual = últimos 31 días.</div>' +
    '<div class="fila-botones"><button class="btn primario bloque" onclick="guardarReporte()">Guardar</button></div>';

function guardarReporte() {

function editarUsuario(id) {

function resetPin(id) {

function pintarCampos() {
  llamar('apiCamposCustom').then(function (cs) {
    estado._campos = cs;
    var filas = cs.map(function (c) {
      return '<tr><td>' + esc(c.etiqueta) + '</td><td class="mini">' + esc(c.clave) + '</td><td>' + esc(c.tipo) + '</td>' +
        '<td>' + (c.activo ? '<span class="etiq verde">activo</span>' : '<span class="etiq rojo">inactivo</span>') + '</td>' +
        '<td><button class="btn chico" onclick="editarCampo(\'' + c.id + '\')">Editar</button> ' +
        '<button class="btn chico" onclick="toggleCampo(\'' + c.id + '\',' + (!c.activo) + ')">' + (c.activo ? 'Ocultar' : 'Activar') + '</button></td></tr>';
    }).join('');
    $('vista').innerHTML = '<div class="tarjeta"><div class="sub">Columnas extra del acta. Se guardan sin tocar las fórmulas de la hoja.</div>' +
      '<div class="fila-botones"><button class="btn primario" onclick="editarCampo()">＋ Nuevo campo</button></div></div>' +
      '<div class="tarjeta tabla-scroll"><table><thead><tr><th>Etiqueta</th><th>Clave</th><th>Tipo</th><th>Estado</th><th></th></tr></thead><tbody>' +
      (filas || '<tr><td colspan="5" class="mini">Sin campos.</td></tr>') + '</tbody></table></div>';
  }).catch(fallo);
}
function editarCampo(id) {
  var c = id ? (estado._campos || []).filter(function (x) { return x.id === id; })[0] : null;
  c = c || { etiqueta: '', tipo: 'texto', opciones: '' };
  var tipos = ['texto', 'numero', 'lista', 'siNo'].map(function (t) { return '<option' + (c.tipo === t ? ' selected' : '') + '>' + t + '</option>'; }).join('');
  var cuerpo = '<div class="rejilla">' +
    '<div class="ancho"><label>Etiqueta</label><input id="cc_etiqueta" value="' + esc(c.etiqueta) + '" /></div>' +
    '<div><label>Tipo</label><select id="cc_tipo">' + tipos + '</select></div>' +
    '<div><label>Opciones (lista, separadas por coma)</label><input id="cc_opciones" value="' + esc(c.opciones) + '" /></div>' +
    '</div><input type="hidden" id="cc_id" value="' + esc(id || '') + '" />' +
    '<div class="fila-botones"><button class="btn primario bloque" onclick="guardarCampo()">Guardar</button></div>';
  abrirModal(id ? 'Editar campo' : 'Nuevo campo', cuerpo);
}
function guardarCampo() {
  llamar('apiGuardarCampoCustom', [{ id: val('cc_id') || '', etiqueta: val('cc_etiqueta'), tipo: val('cc_tipo'), opciones: val('cc_opciones') }])
    .then(function () { cerrarModal(); avisar('Campo guardado.'); recargarBase().then(pintarCampos); }).catch(fallo);
}
function toggleCampo(id, activar) {
  llamar('apiCambiarCampoCustom', [id, activar]).then(function () { recargarBase().then(pintarCampos); }).catch(fallo);
}

/* -------------------------------- auditoría -------------------------------- */

function pintarAuditoria() {
  llamar('apiAuditoria', [200]).then(function (ls) {
    var filas = ls.map(function (l) {
      return '<tr><td class="mini">' + esc(l.fechaHora) + '</td><td>' + esc(l.usuario) + '</td><td>' + esc(l.accion) + '</td>' +
        '<td>' + esc(l.folio) + '</td><td>' + esc(l.campo) + '</td><td class="mini">' + esc(l.valorAnterior) + '</td><td class="mini">' + esc(l.valorNuevo) + '</td></tr>';
    }).join('');
    $('vista').innerHTML = '<div class="tarjeta tabla-scroll"><table><thead><tr><th>Fecha/hora</th><th>Usuario</th><th>Acción</th><th>Folio</th><th>Campo</th><th>Antes</th><th>Después</th></tr></thead><tbody>' +
      (filas || '<tr><td colspan="7" class="mini">Sin movimientos.</td></tr>') + '</tbody></table></div>';
  }).catch(fallo);
}

/* --------------------------------- ajustes --------------------------------- */

function pintarAjustes() {
  var c = estado.config;
  $('vista').innerHTML = '<div class="tarjeta"><h3>Ajustes generales</h3><div class="rejilla">' +
    '<div class="ancho"><label>Empresa</label><input id="cfg_empresa" value="' + esc(c.empresa || '') + '" /></div>' +
    '<div><label>SLA objetivo por defecto (min)</label><input id="cfg_slaVerde" type="number" value="' + esc(c.slaVerde || 45) + '" /></div>' +
    '<div><label>SLA ámbar por defecto (min)</label><input id="cfg_slaAmbar" type="number" value="' + esc(c.slaAmbar || 90) + '" /></div>' +
    '<div><label>Horas de sesión</label><input id="cfg_horasSesion" type="number" value="' + esc(c.horasSesion || 12) + '" /></div>' +
    '</div><div class="mini" style="margin-top:8px">Estos umbrales aplican cuando ninguna regla de la matriz de SLA coincide.</div>' +
    '<div class="fila-botones"><button class="btn primario bloque" onclick="guardarAjustes()">Guardar</button></div></div>';
}
function guardarAjustes() {
  llamar('apiGuardarConfig', [{ empresa: val('cfg_empresa'), slaVerde: val('cfg_slaVerde'), slaAmbar: val('cfg_slaAmbar'), horasSesion: val('cfg_horasSesion') }])
    .then(function (cfg) { estado.config = cfg; avisar('Ajustes guardados.'); pintarAjustes(); }).catch(fallo);
}

/* --------------------------------- arranque -------------------------------- */
window.addEventListener('load', arrancar);
</script>
<script>
/* Quinta parte: módulo de PRUEBA CONTROLADA (estudio de tiempos). */

var ETAPAS_PRUEBA = { posicionado: 'Furgón posicionado', extraccion: 'Extrayendo', extraido: 'Extracción terminada',
  acomodo: 'Acomodando', acomodado: 'Acomodo terminado', finalizado: 'Liberado' };
var SIG_PRUEBA = { posicionado: { marca: 'inicioExt', txt: '▶ Inicio extracción' },
  extraccion: { marca: 'finExt', txt: '■ Fin extracción' },
  extraido: { marca: 'inicioAco', txt: '▶ Inicio acomodo' },
  acomodo: { marca: 'finAco', txt: '■ Fin acomodo' } };
var pruebaDesfase = 0;

function pintarPrueba() {
  detenerTic();
  llamar('apiPruebas').then(function (r) {
    pruebaDesfase = (r.serverNowMs || Date.now()) - Date.now();
    estado._pruebasVivas = r.vivas; estado._pruebasHist = r.historial;
    var html = '<div class="fila-botones" style="margin-bottom:14px">' +
      '<button class="btn primario" onclick="abrirNuevaPrueba()">＋ Nueva prueba controlada</button>' +
      '<button class="btn chico" onclick="pintarPrueba()">↻ Actualizar</button></div>';
    html += r.vivas.length ? '<div id="lista-pruebas">' + r.vivas.map(tarjetaPrueba).join('') + '</div>'
      : '<div class="tarjeta vacio">No hay pruebas en curso.</div>';
    if (esAdmin() && r.historial.length) {
      html += '<div class="tarjeta tabla-scroll"><h3>Pruebas finalizadas</h3><table><thead><tr>' +
        '<th>Folio</th><th>Config</th><th>Tons</th><th>Extr.</th><th>Acomodo</th><th>Total</th><th>Tons/h</th></tr></thead><tbody>' +
        r.historial.map(function (p) {
          return '<tr><td>' + esc(p.folio) + '</td><td>' + esc(p.config) + '</td><td>' + esc(p.totalTons) + '</td>' +
            '<td>' + esc(p.tiempoExtraccionMin) + '</td><td>' + esc(p.tiempoAcomodoMin) + '</td>' +
            '<td>' + esc(p.tiempoTotalMin) + '</td><td>' + esc(p.tonsPorHora) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    $('vista').innerHTML = html;
    arrancarTicPrueba();
  }).catch(fallo);
}
function tarjetaPrueba(p) {
  var sig = SIG_PRUEBA[p.estado];
  var acciones = sig ? '<button class="btn primario" onclick="marcaPrueba(\'' + p.id + '\',\'' + sig.marca + '\')">' + sig.txt + '</button>' : '';
  acciones += '<button class="btn rojo" onclick="abrirFinalizarPrueba(\'' + p.id + '\')">✔ Finalizar</button>';
  return '<div class="tarjeta prueba-viva borde-verde" data-id="' + p.id + '" data-pos="' + p.posicionadoMs + '">' +
    '<div class="encab-maniobra"><span class="folio">' + esc(p.folio) + '</span>' +
    '<span class="chip">Config ' + esc(p.config) + '</span>' +
    '<span class="cli">' + esc(p.totalTons) + ' t · ' + esc(p.totalAtados) + ' atados</span>' +
    '<span class="crono" data-cronop style="margin-left:auto">00:00</span></div>' +
    '<div style="margin:8px 0"><span class="chip" data-etp>' + esc(ETAPAS_PRUEBA[p.estado] || p.estado) + '</span></div>' +
    '<div class="fila-botones">' + acciones + '</div></div>';
}
var ticPrueba = null;
function arrancarTicPrueba() { if (ticPrueba) { clearInterval(ticPrueba); } tticP(); ticPrueba = setInterval(tticP, 1000); }
function tticP() {
  var nodos = document.querySelectorAll('.prueba-viva');
  var ahora = Date.now() + pruebaDesfase;
  for (var i = 0; i < nodos.length; i++) {
    var n = nodos[i], pos = Number(n.getAttribute('data-pos')) || ahora;
    var c = n.querySelector('[data-cronop]'); if (c) { c.textContent = relojDesde(ahora - pos); }
  }
}
function abrirNuevaPrueba() {
  estado.sel = { staff: [] };
  var cuerpo = '<div class="rejilla">' +
    '<div><label>ID de furgón *</label><input id="p_furgonId" placeholder="TCAR112233" oninput="this.value=this.value.toUpperCase()" /></div>' +
    '<div><label>Configuración *</label><select id="p_config"><option value="">Elige…</option>' +
      '<option value="A">A · 1 montacargas (extrae + acomoda)</option>' +
      '<option value="B">B · 2 montacargas en paralelo</option>' +
      '<option value="C">C · 2 divididos (1 extrae, 1 acomoda)</option></select></div>' +
    '<div><label>Cliente</label><select id="p_cliente">' + opcionesDe('clientes', '', true) + '</select></div>' +
    '<div><label>Material</label><select id="p_material">' + opcionesDe('materiales', 'Celulosa', true) + '</select></div>' +
    '<div><label>Total toneladas</label><input id="p_tons" type="number" step="0.01" /></div>' +
    '<div><label>Total atados</label><input id="p_atados" type="number" /></div>' +
    '<div><label>Presentación</label><select id="p_present">' + opcionesDe('presentaciones', '', true) + '</select></div>' +
    '<div class="ancho"><label>Montacargas · operador · aditamento</label>' + maquinasPickerHTML([]) + '</div>' +
    '</div>' +
    '<div class="mini">Al iniciar se registra “Furgón posicionado y listo”. Luego marca cada fase desde la tarjeta.</div>' +
    '<div class="fila-botones"><button class="btn verde bloque" onclick="iniciarPrueba()">▶ Iniciar prueba</button></div>';
  abrirModal('Nueva prueba controlada', cuerpo, 620);
}
function iniciarPrueba() {
  if (!val('p_furgonId').trim()) { avisar('Escribe el ID de furgón.', true); return; }
  if (!val('p_config')) { avisar('Elige la configuración A/B/C.', true); return; }
  var datos = { furgonId: val('p_furgonId'), config: val('p_config'), cliente: val('p_cliente'),
    material: val('p_material'), totalTons: val('p_tons'), totalAtados: val('p_atados'),
    presentacion: val('p_present'), staffIds: [], maquinas: leerMaquinas($('modal')) };
  llamar('apiIniciarPrueba', [datos]).then(function () { cerrarModal(); avisar('Prueba iniciada.'); pintarPrueba(); }).catch(fallo);
}
function marcaPrueba(id, marca) {
  llamar('apiMarcaPrueba', [id, marca]).then(function () { pintarPrueba(); }).catch(fallo);
}
function abrirFinalizarPrueba(id) {
  var p = (estado._pruebasVivas || []).filter(function (x) { return x.id === id; })[0] || {};
  var esC = p.config === 'C';
  var cuerpo = '<div class="rejilla">' +
    (esC ? '<div><label>Espera FL1 por FL2 (min)</label><input id="pf_espera" type="number" step="0.1" value="' + esc(p.esperaFL1Min) + '" /></div>' : '') +
    '<div><label>Huella m²</label><input id="pf_m2" type="number" step="0.01" value="' + esc(p.m2) + '" /></div>' +
    '<div><label>Niveles de estiba</label><input id="pf_niv" type="number" value="' + esc(p.nivelesEstiba) + '" /></div>' +
    '<div><label>Total toneladas</label><input id="pf_tons" type="number" step="0.01" value="' + esc(p.totalTons) + '" /></div>' +
    '<div class="ancho"><label>Observaciones</label><textarea id="pf_obs">' + esc(p.observaciones) + '</textarea></div>' +
    '</div><div class="mini">Se registra “Furgón liberado” y se calculan extracción, acomodo, total y toneladas/hora.</div>' +
    '<div class="fila-botones"><button class="btn rojo bloque" onclick="finalizarPrueba(\'' + id + '\')">✔ Liberar y calcular</button></div>';
  abrirModal('Finalizar prueba ' + (p.folio || ''), cuerpo);
}
function finalizarPrueba(id) {
  var datos = { esperaFL1Min: val('pf_espera'), m2: val('pf_m2'), nivelesEstiba: val('pf_niv'),
    totalTons: val('pf_tons'), observaciones: val('pf_obs') };
  llamar('apiFinalizarPrueba', [id, datos]).then(function (r) {
    cerrarModal(); avisar('Prueba cerrada · ' + r.tiempoTotalMin + ' min · ' + r.tonsPorHora + ' t/h.'); pintarPrueba();
  }).catch(fallo);
}
</script>
