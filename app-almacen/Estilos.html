<style>
  :root {
    --bg: #0f172a;          /* slate-900 */
    --panel: #1e293b;       /* slate-800 */
    --panel2: #273549;
    --linea: #334155;       /* slate-700 */
    --texto: #f1f5f9;       /* slate-100 */
    --tenue: #94a3b8;       /* slate-400 */
    --acento: #38bdf8;      /* sky-400 */
    --acento2: #0ea5e9;
    --verde: #22c55e;
    --ambar: #f59e0b;
    --rojo: #ef4444;
    --sombra: 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .oculto { display: none !important; }
  .cargando {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: var(--tenue); font-size: 1.1rem;
  }

  /* Encabezado */
  .barra {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--panel);
    border-bottom: 1px solid var(--linea);
  }
  .barra .marca { font-weight: 800; letter-spacing: .5px; }
  .barra .marca span { color: var(--acento); }
  .barra .quien { margin-left: auto; text-align: right; font-size: .8rem; color: var(--tenue); }
  .barra .quien b { color: var(--texto); display: block; font-size: .9rem; }
  .chip {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: .68rem; font-weight: 700; letter-spacing: .5px;
    background: var(--panel2); color: var(--acento); border: 1px solid var(--linea);
  }

  /* Navegación */
  .tabs {
    display: flex; gap: 4px; padding: 8px 12px; overflow-x: auto;
    background: var(--panel); border-bottom: 1px solid var(--linea);
  }
  .tabs button {
    flex: 0 0 auto; padding: 8px 14px; border: 1px solid transparent;
    border-radius: 10px; background: transparent; color: var(--tenue);
    font-weight: 600; font-size: .9rem; cursor: pointer;
  }
  .tabs button.activa { background: var(--panel2); color: var(--texto); border-color: var(--linea); }

  main { padding: 16px; max-width: 900px; margin: 0 auto; }

  /* Tarjetas */
  .tarjeta {
    background: var(--panel); border: 1px solid var(--linea);
    border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: var(--sombra);
  }
  .tarjeta h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .tarjeta .sub { color: var(--tenue); font-size: .82rem; margin-bottom: 10px; }

  /* Formularios */
  label { display: block; font-size: .78rem; color: var(--tenue); margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--linea); background: var(--panel2); color: var(--texto);
    font-size: 1rem; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--acento2); border-color: var(--acento2); }
  textarea { min-height: 70px; resize: vertical; }
  .rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .rejilla { grid-template-columns: 1fr; } }
  .rejilla .ancho { grid-column: 1 / -1; }

  /* Botones */
  button.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 16px; border-radius: 12px; border: 1px solid var(--linea);
    background: var(--panel2); color: var(--texto); font-weight: 700; font-size: 1rem;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button.btn:active { transform: translateY(1px); }
  button.btn:disabled { opacity: .5; cursor: default; }
  .btn.primario { background: var(--acento2); border-color: var(--acento2); color: #04121c; }
  .btn.verde { background: var(--verde); border-color: var(--verde); color: #052e16; }
  .btn.ambar { background: var(--ambar); border-color: var(--ambar); color: #3a2606; }
  .btn.rojo { background: var(--rojo); border-color: var(--rojo); color: #3a0a0a; }
  .btn.bloque { width: 100%; }
  .btn.chico { padding: 7px 11px; font-size: .82rem; border-radius: 9px; }
  .fila-botones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

  /* Login */
  .login { min-height: 100vh; display: flex; flex-direction: column;
           align-items: center; justify-content: center; padding: 24px; gap: 18px; }
  .login .logo { font-size: 1.8rem; font-weight: 800; letter-spacing: 1px; }
  .login .logo span { color: var(--acento); }
  .login .caja { width: 100%; max-width: 420px; }
  .segmentos { display: flex; gap: 6px; background: var(--panel2); padding: 5px;
               border-radius: 12px; margin-bottom: 16px; }
  .segmentos button { flex: 1; padding: 10px; border-radius: 9px; border: none;
                      background: transparent; color: var(--tenue); font-weight: 700; cursor: pointer; }
  .segmentos button.activa { background: var(--acento2); color: #04121c; }

  .operadores { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .operadores button { padding: 16px; border-radius: 12px; border: 1px solid var(--linea);
                       background: var(--panel2); color: var(--texto); font-weight: 700;
                       font-size: 1rem; cursor: pointer; text-align: left; }
  .operadores button.sel { border-color: var(--acento); background: #10344a; }

  .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
  .teclado button { padding: 18px; font-size: 1.4rem; font-weight: 700; border-radius: 12px;
                    border: 1px solid var(--linea); background: var(--panel2); color: var(--texto); cursor: pointer; }
  .puntos { display: flex; gap: 12px; justify-content: center; margin: 8px 0 4px; }
  .puntos i { width: 16px; height: 16px; border-radius: 50%; background: var(--panel2);
              border: 2px solid var(--linea); display: inline-block; }
  .puntos i.lleno { background: var(--acento); border-color: var(--acento); }

  /* Cronómetro */
  .crono { font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: 1px; }
  .crono.grande { font-size: 2.6rem; }
  .semaforo { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: .82rem; }
  .luz { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .luz.verde { background: var(--verde); box-shadow: 0 0 10px var(--verde); }
  .luz.ambar { background: var(--ambar); box-shadow: 0 0 10px var(--ambar); }
  .luz.rojo { background: var(--rojo); box-shadow: 0 0 10px var(--rojo); }
  .borde-verde { border-left: 5px solid var(--verde); }
  .borde-ambar { border-left: 5px solid var(--ambar); }
  .borde-rojo { border-left: 5px solid var(--rojo); }
  .borde-pausa { border-left: 5px solid var(--tenue); }

  .encab-maniobra { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .encab-maniobra .folio { font-weight: 800; font-size: 1.05rem; }
  .encab-maniobra .cli { color: var(--tenue); }
  .metricas { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0; }
  .metricas div span { display: block; color: var(--tenue); font-size: .72rem; }
  .metricas div b { font-size: 1.05rem; }
  .en-pausa { color: var(--ambar); font-weight: 700; }

  /* Tablas */
  .tabla-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--linea); white-space: nowrap; }
  th { color: var(--tenue); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  tr:hover td { background: var(--panel2); }
  .etiq { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.7rem; font-weight:700; }
  .etiq.verde { background: rgba(34,197,94,.15); color: var(--verde); }
  .etiq.ambar { background: rgba(245,158,11,.15); color: var(--ambar); }
  .etiq.rojo { background: rgba(239,68,68,.15); color: var(--rojo); }

  /* Notificación */
  #notificacion {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--acento2); color: var(--texto);
    padding: 12px 18px; border-radius: 12px; box-shadow: var(--sombra); z-index: 50; max-width: 90%;
  }
  #notificacion.malo { border-color: var(--rojo); }

  /* Modal */
  .telon { position: fixed; inset: 0; background: rgba(2,6,23,.7); z-index: 40;
           display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; }
  .modal { background: var(--panel); border: 1px solid var(--linea); border-radius: 16px;
           padding: 18px; width: 100%; max-width: 560px; box-shadow: var(--sombra); }
  .modal h3 { margin-top: 0; }
  .modal .cerrar { float: right; background: transparent; border: none; color: var(--tenue);
                   font-size: 1.4rem; cursor: pointer; }

  .vacio { text-align: center; color: var(--tenue); padding: 30px 10px; }
  .lista-cat { display: flex; flex-direction: column; gap: 6px; }
  .lista-cat .item { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
                     background: var(--panel2); border-radius: 9px; }
  .lista-cat .item.inactivo { opacity: .5; }
  .lista-cat .item .val { flex: 1; }
  .mini { font-size: .75rem; color: var(--tenue); }
</style>
