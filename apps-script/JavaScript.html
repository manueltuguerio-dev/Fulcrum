    {id:"pagos",label:"Aplicación de pagos",icon:'<rect x="2" y="6" width="20" height="13" rx="2" stroke-width="1.7"/><path d="M2 10h20" stroke-width="1.7"/>'},
    {id:"ordenes",label:"Órdenes de compra",icon:'<path d="M4 5h16M4 12h16M4 19h10" stroke-width="1.7"/><circle cx="19" cy="19" r="2" stroke-width="1.7"/>'},
    {id:"proveedores",label:"Costos (XML)",icon:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z" stroke-width="1.7"/><path d="M8 13l2 2-2 2M16 13l-2 2 2 2" stroke-width="1.7"/>'},
    {id:"gastos",label:"Gastos",icon:'<circle cx="12" cy="12" r="9" stroke-width="1.7"/><path d="M8 12h8" stroke-width="1.7"/>'},
    {id:"clientes",label:"Clientes",icon:'<circle cx="12" cy="8" r="3.4" stroke-width="1.7"/><path d="M5 20a7 7 0 0 1 14 0" stroke-width="1.7"/>'},
    {id:"proyecciones",label:"Proyecciones",icon:'<path d="M3 3v18h18" stroke-width="1.7"/><path d="M7 14l3-4 3 3 5-7" stroke-width="1.7"/>'},
    {id:"contabilidad",label:"Contabilidad",icon:'<path d="M4 3h16v18H4z" stroke-width="1.7"/><path d="M8 7h8M8 11h8M8 15h5" stroke-width="1.7"/>'},
    {id:"cierres",label:"Cierres / respaldos",icon:'<path d="M3 4h18v5H3z" stroke-width="1.7"/><path d="M5 9v11h14V9M9 13h6" stroke-width="1.7"/>'},
  ];
  let current="dashboard";
  function renderNav(){
    const c={proyectos:state.proyectos.length,cotizaciones:state.cotizaciones.length,ventas:state.ventas.length,ordenes:state.ordenes.length,
      facturas:state.facturas.length,pagos:state.pagos.length,proveedores:state.proveedores.length,gastos:state.gastos.length,clientes:state.clientes.length,cierres:snaps.length};
    $("#nav").innerHTML=views.map(v=>`<button class="navbtn ${v.id===current?"active":""}" data-action="nav" data-view="${v.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">${v.icon}</svg><span>${v.label}</span>
      ${c[v.id]!=null?`<span class="badge num">${c[v.id]}</span>`:""}</button>`).join("");
  }

  /* ---------- componentes ---------- */
  const printerIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="15" height="15"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2M6 14h12v7H6z" stroke-width="1.7"/></svg>';
  const plusIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14" stroke-width="2"/></svg>';
  function headBar(title,sub,addType,addLabel,reportKind){
    return `<div class="head"><div><h2>${title}</h2><p>${sub}</p></div><div class="headacts">
      ${reportKind?`<button class="ghost" data-action="report" data-kind="${reportKind}">${printerIcon}Descargar PDF</button>`:""}
      ${addType?`<button class="primary" data-action="add" data-type="${addType}">${plusIcon}${addLabel}</button>`:""}
      </div></div>`;
  }
  function filterBar(scope,current,opts){
    return `<div class="filterbar"><span class="flabel">Estatus:</span>`+opts.map(o=>
      `<button class="fbtn ${o.v===current?"on":""}" data-action="filter" data-scope="${scope}" data-val="${o.v}">${o.label}</button>`).join("")+`</div>`;
  }
  function monthBar(scope,current,withAll){
    let opts=allMonths().map(m=>({v:m,label:monthLabel(m)}));
    if(withAll)opts=[{v:"all",label:"Todos"}].concat(opts);
    if(!opts.length)opts=[{v:current,label:monthLabel(current)}];
    return `<div class="filterbar"><span class="flabel">Mes:</span>`+opts.map(o=>
      `<button class="fbtn ${o.v===current?"on":""}" data-action="filter" data-scope="${scope}" data-val="${o.v}" style="text-transform:capitalize">${o.label}</button>`).join("")+`</div>`;
  }
  function emptyRow(cols,msg){return `<tr><td colspan="${cols}"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h16M4 17h10" stroke-width="1.6"/></svg><div>${msg}</div></div></td></tr>`;}

  function barChart(data){
    if(!data.length)return `<p class="empty">Sin movimientos para proyectar.</p>`;
    const max=Math.max(...data.flatMap(d=>[d.cobrar,d.pagar]),1);
    const gw=104,W=data.length*gw+50,H=250,base=H-42,top=26,plot=base-top;let g="";
    for(let i=1;i<=3;i++){const y=base-plot*i/3;g+=`<line class="grid" x1="44" y1="${y}" x2="${W-6}" y2="${y}"/><text x="40" y="${y+3}" text-anchor="end">${money0(max*i/3)}</text>`;}
    data.forEach((d,i)=>{const x=50+i*gw,hc=d.cobrar/max*plot,hp=d.pagar/max*plot;
      g+=`<rect x="${x}" y="${base-hc}" width="30" height="${hc}" rx="4" fill="var(--good)"/><rect x="${x+34}" y="${base-hp}" width="30" height="${hp}" rx="4" fill="var(--accent)"/>`;
      if(d.cobrar>0)g+=`<text class="vlab" x="${x+15}" y="${base-hc-5}" text-anchor="middle">${money0(d.cobrar)}</text>`;
      if(d.pagar>0)g+=`<text class="vlab" x="${x+49}" y="${base-hp-5}" text-anchor="middle">${money0(d.pagar)}</text>`;
      g+=`<text x="${x+32}" y="${base+18}" text-anchor="middle" style="text-transform:capitalize">${monthLabel(d.k)}</text>`;});
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Proyección de cobros y pagos por mes"><line class="axis" x1="44" y1="${base}" x2="${W-6}" y2="${base}"/>${g}</svg>`;
  }

  /* ---------- vistas ---------- */
  function vDashboard(){
    const t=totals(),proj=projections();
    const cobranza=(t.cobrado+t.porCobrar)>0?Math.round(t.cobrado/(t.cobrado+t.porCobrar)*100):0;
    const venta=state.facturas.reduce((a,f)=>a+facSubtotal(f),0);
    const costo=state.facturas.reduce((a,f)=>a+facCosto(f),0);
    const util=venta-costo,mgp=venta>0?util/venta*100:0;
    return `<div class="head"><div><h2>Tablero</h2><p>Resumen operativo · ${fmtDate(todayStr())}</p></div></div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">Facturado</div><div class="val num">${money0(t.facturado)}</div><div class="sub">${state.facturas.length} facturas</div></div>
      <div class="kpi k-good"><div class="lbl">Cobrado</div><div class="val num">${money0(t.cobrado)}</div><div class="sub">${cobranza}% de la cartera</div></div>
      <div class="kpi k-warn"><div class="lbl">Por cobrar</div><div class="val num">${money0(t.porCobrar)}</div><div class="sub">saldo de clientes</div></div>
      <div class="kpi k-bad"><div class="lbl">Vencido</div><div class="val num">${money0(t.vencido)}</div><div class="sub">requiere gestión</div></div>
      <div class="kpi k-info"><div class="lbl">Por pagar</div><div class="val num">${money0(t.porPagar)}</div><div class="sub">${state.ordenes.filter(o=>o.estatus!=="pagada").length} órdenes</div></div>
      <div class="kpi"><div class="lbl">Cotizaciones abiertas</div><div class="val num">${t.cotAbiertas}</div><div class="sub">${money0(t.cotMonto)} en pipeline</div></div>
    </div>
    <div class="panel" style="padding:18px 20px"><div class="panel-head" style="padding:0 0 14px;border:0"><h3>Rentabilidad facturada (sin IVA)</h3><span class="hint">venta vs. costo de lo facturado</span></div>
      <div class="statrow">
        <div><div class="s-lbl">Venta</div><div class="s-val num">${money0(venta)}</div></div>
        <div><div class="s-lbl">Costo</div><div class="s-val num">${money0(costo)}</div></div>
        <div><div class="s-lbl">Utilidad bruta</div><div class="s-val num" style="color:var(--good)">${money0(util)}</div></div>
        <div><div class="s-lbl">Margen</div><div class="s-val num" style="color:var(--accent-strong)">${mgp.toFixed(1)}%</div></div>
      </div></div>
    <div class="panel chartcard"><div class="panel-head" style="padding:0 0 12px;border:0"><h3>Proyección de flujo de efectivo</h3>
      <div class="legend"><span><i style="background:var(--good)"></i>Por cobrar</span><span><i style="background:var(--accent)"></i>Por pagar</span></div></div>${barChart(proj)}</div>
    <div class="two">${panelCartera()}${panelCompromisos()}</div>`;
  }
  function panelCartera(){
    const rows=state.facturas.filter(f=>facSaldo(f)>0.01).sort((a,b)=>a.vencimiento.localeCompare(b.vencimiento)).slice(0,5);
    return `<div class="panel"><div class="panel-head"><h3>Cartera por cobrar</h3><span class="hint">próximos vencimientos</span></div><div class="tablewrap"><table>
      <thead><tr><th>Folio</th><th>Cliente</th><th>Vence</th><th class="r">Saldo</th><th></th></tr></thead><tbody>${rows.length?rows.map(f=>{const e=facEstatus(f);
      return `<tr><td class="mono">${f.folio}</td><td>${f.cliente}</td><td>${fmtDate(f.vencimiento)}</td><td class="r num strong">${money(facSaldo(f))}</td><td><span class="pill ${e.cls}">${e.k}</span></td></tr>`;}).join(""):emptyRow(5,"Todo cobrado 🎉")}</tbody></table></div></div>`;
  }
  function panelCompromisos(){
    const rows=state.ordenes.filter(o=>o.estatus!=="pagada").sort((a,b)=>(a.fechaPago||"").localeCompare(b.fechaPago||"")).slice(0,5);
    return `<div class="panel"><div class="panel-head"><h3>Compromisos de pago</h3><span class="hint">órdenes por liquidar</span></div><div class="tablewrap"><table>
      <thead><tr><th>Folio</th><th>Proveedor</th><th>Programado</th><th class="r">Total</th></tr></thead><tbody>${rows.length?rows.map(o=>
      `<tr><td class="mono">${o.folio}</td><td>${o.proveedor}</td><td>${fmtDate(o.fechaPago)}</td><td class="r num strong">${money(ocTotal(o))}</td></tr>`).join(""):emptyRow(4,"Sin pagos pendientes")}</tbody></table></div></div>`;
  }

  function vProyectos(){
    const months=[{v:"all",label:"Todos"}].concat(allMonths().map(m=>({v:m,label:monthLabel(m)})));
    const list=state.proyectos.filter(p=>ui.proyMonth==="all"||p.mes===ui.proyMonth);
    let tc=0,tv=0;
    const body=list.length?list.map(p=>{const d=proyDerived(p);tc+=d.costo;tv+=d.venta;
      const parts=[];if(d.cots.length)parts.push(d.cots.length+" cot");if(d.ventas.length)parts.push(d.ventas.length+" OV");if(d.ordenes.length)parts.push(d.ordenes.length+" OC");if(d.facturas.length)parts.push(d.facturas.length+" fac");
      const folios=[...d.cots,...d.ventas,...d.ordenes,...d.facturas].map(x=>x.folio).join(", ");
      const pcli=state.clientes.find(x=>x.id===p.clienteId);
      return `<tr><td class="strong">${p.nombre}</td><td>${pcli?pcli.nombre:(p.cliente||"—")}</td><td style="text-transform:capitalize">${monthLabel(p.mes)}</td>
      <td><div>${parts.join(" · ")||"—"}</div><div class="mono" style="color:var(--text-faint);font-size:10.5px">${folios}</div></td>
      <td class="r num">${money(d.venta)}</td><td class="r num">${money(d.costo)}</td>
      <td class="r num strong" style="color:${(d.venta-d.costo)>=0?"var(--good)":"var(--bad)"}">${money(d.venta-d.costo)}</td>
      <td class="r num" style="color:${d.margen>=0?"var(--good)":"var(--bad)"}">${d.margen.toFixed(1)}%</td>
      <td><div class="rowact"><button class="act" data-action="edit" data-type="proyecto" data-id="${p.id}">Editar</button>
        <button class="act warnact" data-action="del" data-type="proyectos" data-id="${p.id}">Eliminar</button></div></td></tr>`;}).join(""):emptyRow(9,"Sin proyectos en este periodo");
    const mg=tv>0?(tv-tc)/tv*100:0;
    return `${headBar("Proyectos","Agrupa varias órdenes de venta, órdenes de compra y facturas · margen neto por proyecto","proyecto","Nuevo proyecto","rep-proyectos")}
    <div class="filterbar"><span class="flabel">Mes:</span>${months.map(o=>`<button class="fbtn ${o.v===ui.proyMonth?"on":""}" data-action="filter" data-scope="proyMonth" data-val="${o.v}" style="text-transform:capitalize">${o.label}</button>`).join("")}</div>
    <div class="panel"><div class="tablewrap"><table>
      <thead><tr><th>Proyecto</th><th>Cliente</th><th>Mes</th><th>Documentos</th><th class="r">Venta</th><th class="r">Costo</th><th class="r">Ganancia</th><th class="r">Margen neto</th><th></th></tr></thead>
      <tbody>${body}</tbody>${list.length?`<tfoot><tr><td colspan="4" class="r">Totales</td><td class="r num">${money(tv)}</td><td class="r num">${money(tc)}</td><td class="r num">${money(tv-tc)}</td><td class="r num">${mg.toFixed(1)}%</td><td></td></tr></tfoot>`:""}</table></div></div>`;
  }

  function vCotizaciones(){
    const opts=[{v:"all",label:"Todos"},{v:"borrador",label:"Borrador"},{v:"enviada",label:"Enviada"},{v:"aceptada",label:"Aceptada"},{v:"rechazada",label:"Rechazada"}];
    const list=state.cotizaciones.filter(c=>ui.cotFilter==="all"||c.estatus===ui.cotFilter);
    return `${headBar("Cotizaciones","Propuestas a clientes · margen por línea · convierte las aceptadas en factura","cotizacion","Nueva cotización","rep-cot")}
    ${filterBar("cotFilter",ui.cotFilter,opts)}
    <div class="panel"><div class="tablewrap"><table>

      <td class="mono">${c.folio}</td><td>${c.cliente}</td><td>${fmtDate(c.fecha)}</td>
      <td>${(c.origenProveedorIds||[]).length?(c.origenProveedorIds.map(pid=>{const p=state.proveedores.find(x=>x.id===pid);

      <td class="r num">${(c.lineas||[]).length}</td><td class="r num" style="color:var(--good);font-weight:600">${cotMargenPct(c).toFixed(1)}%</td>

      <td><div class="rowact">
        <button class="act" data-action="print" data-type="cot" data-id="${c.id}">PDF</button>
        <button class="act" data-action="edit" data-type="cotizacion" data-id="${c.id}">Editar</button>
        <button class="act" data-action="cot-dup" data-id="${c.id}">Duplicar</button>
        ${c.ventaId?`<span class="pill p-info">→ orden de venta</span>`:(c.estatus==="aceptada"?`<button class="act good" data-action="cot-venta" data-id="${c.id}">A orden de venta</button>`:`<button class="act" data-action="cot-status" data-id="${c.id}">Avanzar</button>`)}
        <button class="act warnact" data-action="del" data-type="cotizaciones" data-id="${c.id}">Eliminar</button>
      </div></td></tr>`).join(""):emptyRow(9,"Sin cotizaciones con ese estatus")}</tbody></table></div></div>`;
  }

  function vVentas(){
    const opts=[{v:"all",label:"Todas"},{v:"abierta",label:"Abierta"},{v:"facturada",label:"Facturada"}];
    const list=state.ventas.filter(o=>ui.ovFilter==="all"||o.estatus===ui.ovFilter);
    return `${headBar("Órdenes de venta","Flujo: cotización → OC del cliente → orden de venta → factura","venta","Nueva orden de venta","rep-ventas")}
    ${filterBar("ovFilter",ui.ovFilter,opts)}
    <div class="panel"><div class="tablewrap"><table>
    <thead><tr><th>Folio</th><th>Cliente</th><th>OC cliente</th><th>Cotización</th><th>Fecha</th><th class="r">Total</th><th>Estatus</th><th></th></tr></thead>
    <tbody>${list.length?list.map(o=>{const c=state.cotizaciones.find(x=>x.id===o.cotizacionId),fac=state.facturas.find(x=>x.id===o.facturaId);
      return `<tr><td class="mono">${o.folio}</td><td>${o.cliente}</td><td class="mono">${o.ocCliente||"—"}</td>

      </div></td></tr>`;}).join(""):emptyRow(8,"Sin órdenes de venta con ese estatus")}</tbody></table></div></div>`;
  }

  function vGastos(){
    const total=state.gastos.reduce((a,g)=>a+g.importe,0);
    const list=[...state.gastos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
    return `${headBar("Gastos","Gastos operativos que afectan el resultado del mes en Contabilidad","gasto","Nuevo gasto","rep-gastos")}
    <div class="panel"><div class="tablewrap"><table>
    <thead><tr><th>Fecha</th><th>Concepto</th><th class="r">Importe</th><th></th></tr></thead>
    <tbody>${list.length?list.map(g=>`<tr><td>${fmtDate(g.fecha)}</td><td>${g.concepto}</td><td class="r num strong">${money(g.importe)}</td>

    const opts=[{v:"all",label:"Todos"},{v:"abierta",label:"Abierta"},{v:"recibida",label:"Recibida"},{v:"pagada",label:"Pagada"}];
    const list=state.ordenes.filter(o=>ui.ocFilter==="all"||o.estatus===ui.ocFilter);
    return `${headBar("Órdenes de compra","Compromisos con proveedores","orden","Nueva orden","rep-oc")}

    <div class="panel"><div class="tablewrap"><table>

    <tbody>${list.length?list.map(o=>`<tr>

  function contaCalc(mes){
    const ingresosCI=state.pagos.filter(p=>monthKey(p.fecha)===mes).reduce((a,p)=>a+p.monto,0);
    const rIva=ivaDefPct()/100;
    const base=ingresosCI/(1+rIva),ivaCobrado=ingresosCI-base,tasa=tasaResico(base),isr=base*tasa;
    const prov=state.proveedores.filter(p=>monthKey(p.fecha)===mes);
    const ivaAcred=prov.reduce((a,p)=>a+p.iva,0),costos=prov.reduce((a,p)=>a+p.subtotal,0);
    const gastos=state.gastos.filter(g=>monthKey(g.fecha)===mes).reduce((a,g)=>a+g.importe,0);
    const ivaCargo=Math.max(0,ivaCobrado-ivaAcred),ivaFavor=Math.max(0,ivaAcred-ivaCobrado);
    return {mes,ingresosCI,base,ivaCobrado,tasa,isr,ivaAcred,costos,gastos,ivaCargo,ivaFavor,total:isr+ivaCargo,utilidad:base-costos-gastos};
  }

  function productList(){
    const map=new Map();
    const add=(desc,costo,precio,margen)=>{if(!desc)return;const k=desc.trim().toLowerCase();if(!k)return;
      map.set(k,{desc:desc.trim(),costo:+costo||0,precio:+precio||0,margen:margen==null?null:+margen});};
    state.cotizaciones.forEach(c=>(c.lineas||[]).forEach(l=>add(l.desc,l.costo,lineaPrecio(l),l.margen)));
    state.ventas.forEach(o=>(o.lineas||[]).forEach(l=>add(l.desc,l.costo,l.precio,null)));
    state.facturas.forEach(f=>(f.lineas||[]).forEach(l=>add(l.desc,l.costo,l.precio,null)));
    state.ordenes.forEach(o=>(o.lineas||[]).forEach(l=>add(l.desc,l.costo,0,null)));

  function makeLineEditor(type,host,initial,onChange,catalog){
    const spec=LINESPEC[type],gt=spec.cols.map(c=>c.w).join(" ")+" 92px 22px";
    const dl=catalog?`<datalist id="fx-prod">${[...catalog.values()].map(p=>`<option value="${escAttr(p.desc)}"></option>`).join("")}</datalist>`:"";
    host.innerHTML=`${dl}<div class="lhead" style="grid-template-columns:${gt}">${spec.cols.map(c=>`<span>${c.h}</span>`).join("")}<span>Importe</span><span></span></div><div class="llist"></div><button type="button" class="ghost lineadd">+ Agregar línea</button>`;
    const list=host.querySelector(".llist");
    const rowHtml=l=>`<div class="lrow" style="grid-template-columns:${gt}">${spec.cols.map(c=>{const v=escAttr(l&&l[c.k]!=null?l[c.k]:(c.v!=null?c.v:""));
      return c.t==="text"?`<input data-k="${c.k}" ${catalog?'list="fx-prod"':""} placeholder="${c.ph||""}" value="${v}">`:`<input data-k="${c.k}" type="number" min="0" step="${c.step||"0.01"}" placeholder="${c.ph||""}" value="${v}">`;}).join("")}<span class="l-imp num">$0.00</span><button type="button" class="l-del" aria-label="Quitar">&times;</button></div>`;
    const read=()=>[...list.querySelectorAll(".lrow")].map(r=>{const o={};spec.cols.forEach(c=>{const el=r.querySelector('[data-k="'+c.k+'"]');o[c.k]=c.t==="text"?el.value.trim():(+el.value||0);});return o;});
    const recalc=()=>{list.querySelectorAll(".lrow").forEach(r=>{const o={};spec.cols.forEach(c=>{const el=r.querySelector('[data-k="'+c.k+'"]');o[c.k]=c.t==="text"?el.value:(+el.value||0);});r.querySelector(".l-imp").textContent=money(spec.imp(o));});onChange(read());};
    host.addEventListener("input",recalc);
    if(catalog)host.addEventListener("change",e=>{const inp=e.target;if(inp.dataset&&inp.dataset.k==="desc"){const p=catalog.get(inp.value.trim().toLowerCase());
      if(p){const row=inp.closest(".lrow"),set=(k,val)=>{const el=row.querySelector('[data-k="'+k+'"]');if(el&&val!=null&&val!=="")el.value=val;};
        set("costo",p.costo||"");if(row.querySelector('[data-k="margen"]')&&p.margen!=null)set("margen",p.margen);
        if(row.querySelector('[data-k="precio"]'))set("precio",p.precio||"");recalc();}}});
    host.addEventListener("click",e=>{if(e.target.closest(".l-del")){if(list.querySelectorAll(".lrow").length>1)e.target.closest(".lrow").remove();recalc();}else if(e.target.closest(".lineadd")){list.insertAdjacentHTML("beforeend",rowHtml());recalc();}});
    (initial&&initial.length?initial:[null]).forEach(l=>list.insertAdjacentHTML("beforeend",rowHtml(l)));
    recalc();
    return {read};
  }

  /* ---------- XML CFDI ---------- */
  function parseCFDI(txt){
    try{const doc=new DOMParser().parseFromString(txt,"application/xml");
      if(doc.getElementsByTagName("parsererror").length)return null;
      const comp=doc.documentElement;if(!comp||comp.localName!=="Comprobante")return null;
      const byLocal=n=>{const els=doc.getElementsByTagName("*");for(let i=0;i<els.length;i++)if(els[i].localName===n)return els[i];return null;};
      const sub=+comp.getAttribute("SubTotal")||0,total=+comp.getAttribute("Total")||0;
      const fecha=(comp.getAttribute("Fecha")||"").slice(0,10)||todayStr(),folio=comp.getAttribute("Folio")||"";
      const em=byLocal("Emisor"),proveedor=em?(em.getAttribute("Nombre")||"Proveedor"):"Proveedor",rfc=em?(em.getAttribute("Rfc")||""):"";
      const imp=byLocal("Impuestos");let iva=imp?+imp.getAttribute("TotalImpuestosTrasladados")||0:0;if(!iva)iva=Math.max(0,total-sub);
      const tfd=byLocal("TimbreFiscalDigital"),uuid=tfd?(tfd.getAttribute("UUID")||""):"";
      // Conceptos del CFDI: permiten cotizar al cliente con el costo real de cada partida.
      const conceptos=[],els=doc.getElementsByTagName("*");
      for(let i=0;i<els.length;i++){const el=els[i];
        if(el.localName!=="Concepto")continue;
        const cant=+el.getAttribute("Cantidad")||0,vu=+el.getAttribute("ValorUnitario")||0;
        const impC=+el.getAttribute("Importe")||(cant*vu);
        conceptos.push({desc:el.getAttribute("Descripcion")||"Concepto",
          unidad:(el.getAttribute("Unidad")||el.getAttribute("ClaveUnidad")||"PZ").toString().slice(0,8),
          cantidad:cant||1,costo:vu||(cant?impC/cant:impC),importe:impC});}
      return {id:uid(),proveedor,rfc,folio,uuid,fecha,subtotal:sub,iva,total,conceptos,cotizadaEn:[]};
    }catch(e){return null;}
  }
  function handleXmlFiles(files){
    const arr=[...files];if(!arr.length)return;let ok=0,fail=0,pend=arr.length;
    arr.forEach(f=>f.text().then(txt=>{const r=parseCFDI(txt);if(r){state.proveedores.push(r);ok++;}else fail++;}).catch(()=>{fail++;}).finally(()=>{if(--pend===0){persist();render();toast(ok+" factura(s) cargada(s) desde XML"+(fail?", "+fail+" no se pudieron leer":""));}}));
  }
  document.addEventListener("change",e=>{if(e.target&&e.target.id==="xmlfile"){handleXmlFiles(e.target.files);e.target.value="";}});
  document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("drag");}});
  document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("drag");});
  document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("drag");handleXmlFiles(e.dataTransfer.files);}});

  /* ---------- entrega de archivos ---------- */
  const CAN_SAVE=()=>!!(window.claude&&window.claude.downloads&&window.claude.downloads.save);
  function legacySave(blob,filename){
    let ok=false;
    try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok=true;}catch(e){}
    return ok;
  }
  // Intenta guardar con la capacidad del visor; si la extensión no está permitida, avisa al llamador.
  function saveVia(filename,data){
    if(!CAN_SAVE())return Promise.reject({code:"unavailable"});
    return window.claude.downloads.save({filename,data});
  }
  function saveErrMsg(err){const c=(err&&err.code)||"unavailable";
    if(c==="declined")return "Descarga cancelada";
    if(c==="too_large")return "El archivo excede el límite de 16 MB";
    if(c==="rate_limited")return "Espera un momento e intenta de nuevo";
    return "";
  }
  // PDF: intenta .pdf y, si el visor no admite esa extensión, ofrece imagen PNG.
  // Entrega el documento: PDF si el visor lo admite; si no, HTML y por último imagen.
  function downloadPDF(doc,filename,previewEl,title){
    let blob;try{blob=doc.output("blob");}catch(e){toast("No se pudo generar el PDF");return;}
    if(!CAN_SAVE()){legacySave(blob,filename);try{doc.save(filename);}catch(e){}toast("Descarga iniciada: "+filename);return;}
    toast("Preparando "+filename+"…");
    const noExt=c=>c==="rejected_extension"||c==="extension_not_enabled";
    saveVia(filename,blob).then(()=>toast("PDF guardado: "+filename)).catch(err=>{
      if(!noExt((err&&err.code)||"")){const m=saveErrMsg(err);toast(m||"No se pudo guardar el archivo");return;}
      if(!previewEl){toast("Este visor no admite archivos PDF");return;}
      toast("Este visor no admite PDF; guardando el documento…");
      downloadHTML(previewEl,filename.replace(/\.pdf$/i,".html"),title||filename).catch(e2=>{
        if(noExt((e2&&e2.code)||""))downloadPNG(previewEl,filename.replace(/\.pdf$/i,".png"));
        else{const m=saveErrMsg(e2);toast(m||"No se pudo guardar el archivo");}
      });
    });
  }
  // CSS del documento, para exportarlo autocontenido (HTML o imagen).
  function docCSS(){let css="";
    try{for(let i=0;i<document.styleSheets.length;i++){const sh=document.styleSheets[i];let rules;
      try{rules=sh.cssRules;}catch(e){continue;}
      for(let j=0;j<rules.length;j++){const t=rules[j].cssText||"";
        if(/\.docpaper|\.cotdoc|\.cot-|\.ci-|\.cc-|\.ct-|\.cm|\.doc\b|\.mg\b|\.tb\b/.test(t))css+=t+"\n";}}}catch(e){}
    return css;}
  // Rasteriza el documento sin librerías (SVG foreignObject → canvas); funciona dentro del sandbox.
  function rasterize(el){
    return new Promise((resolve,reject)=>{
      const S=2,w=el.offsetWidth;
      // El texto reflows algo más alto dentro del SVG: se dibuja con holgura y luego se recorta el blanco.
      const h=Math.round((el.scrollHeight||el.offsetHeight)*1.45+80);
      if(!w||!h)return reject();
      let inner;
      try{const clone=el.cloneNode(true);clone.setAttribute("xmlns","http://www.w3.org/1999/xhtml");
        inner=new XMLSerializer().serializeToString(clone);}catch(e){return reject();}
      const base='*{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;box-sizing:border-box}';
      const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'+
        '<foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px">'+
        '<style>'+(base+docCSS()).replace(/</g,"&lt;")+'</style>'+inner+'</div></foreignObject></svg>';
      const img=new Image();
      img.onload=()=>{try{
        const c=document.createElement("canvas");c.width=w*S;c.height=h*S;
        const cx=c.getContext("2d");cx.fillStyle="#ffffff";cx.fillRect(0,0,c.width,c.height);
        cx.save();cx.scale(S,S);cx.drawImage(img,0,0);cx.restore();
        let last=c.height-1;
        try{const d=cx.getImageData(0,0,c.width,c.height).data;
          outer:for(let y=c.height-1;y>=0;y--){for(let x=0;x<c.width;x++){const i=(y*c.width+x)*4;
            if(d[i]<248||d[i+1]<248||d[i+2]<248){last=y;break outer;}}}}catch(e){}
        const pad=16*S,fh=Math.min(c.height,last+pad);
        const out=document.createElement("canvas");out.width=c.width;out.height=fh;
        const ox=out.getContext("2d");ox.fillStyle="#ffffff";ox.fillRect(0,0,out.width,out.height);
        ox.drawImage(c,0,0);
        out.toBlob(b=>b?resolve(b):reject(),"image/png");}catch(e){reject();}};
      img.onerror=()=>reject();
      img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    });
  }
  function standaloneHTML(el,title){
    return "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><title>"+title+
      "</title><style>body{margin:0;padding:24px;background:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}\n"+
      docCSS()+"</style></head><body>"+el.outerHTML+"</body></html>";
  }
  function downloadPNG(el,filename){
    toast("Generando imagen…");
    rasterize(el).then(blob=>{
      if(!CAN_SAVE()){legacySave(blob,filename);toast("Descarga iniciada: "+filename);return;}
      saveVia(filename,blob).then(()=>toast("Imagen guardada: "+filename))
        .catch(err=>{const m=saveErrMsg(err);toast(m||"No se pudo guardar la imagen");});
    }).catch(()=>toast("No se pudo generar la imagen"));
  }
  function downloadHTML(el,filename,title){
    const data=standaloneHTML(el,title);
    if(!CAN_SAVE()){legacySave(new Blob([data],{type:"text/html"}),filename);toast("Descarga iniciada: "+filename);return Promise.resolve();}
    return saveVia(filename,data).then(()=>toast("Documento guardado: "+filename));
  }

        if(p){if(!Array.isArray(p.cotizadaEn))p.cotizadaEn=[];p.cotizadaEn.push(copia.id);}});
      persist();render();openForm("cotizacion",{id:copia.id});
      toast("Duplicada como "+copia.folio+" con fecha de hoy");}
    else if(a==="prov-sel"){const s=ui.provSel||(ui.provSel=[]);const i=s.indexOf(id);
      if(i>=0)s.splice(i,1);else s.push(id);render();}
    else if(a==="prov-sel-all"){const todos=state.proveedores.map(p=>p.id);
      ui.provSel=(ui.provSel&&ui.provSel.length===todos.length)?[]:todos;render();}
    else if(a==="prov-sel-none"){ui.provSel=[];render();}
    else if(a==="prov-cotizar"){openForm("cotizarProv");}
    else if(a==="ov-factura"){const v=state.ventas.find(x=>x.id===id);
      const lineas=(v.lineas||[]).map(l=>({desc:l.desc,cantidad:l.cantidad,costo:l.costo,precio:l.precio}));
      const f={id:uid(),folio:nextFolio("FAC",state.facturas),cliente:v.cliente,fecha:todayStr(),vencimiento:addDays(todayStr(),30),flujo:"creada",lineas,ventaId:v.id};
      state.facturas.push(f);v.facturaId=f.id;v.estatus="facturada";persist();current="facturas";render();}
    else if(a==="oc-recibir"){state.ordenes.find(x=>x.id===id).estatus="recibida";persist();render();}
    else if(a==="oc-pagar"){state.ordenes.find(x=>x.id===id).estatus="pagada";persist();render();}
    else if(a==="fac-flujo"){const f=state.facturas.find(x=>x.id===id);const seq=FLUJO.map(x=>x.v);f.flujo=seq[(seq.indexOf(f.flujo)+1)%seq.length];persist();render();}
    else if(a==="fac-pago"){openForm("pago",{preFacId:id});}
    else if(a==="del"){const type=b.dataset.type;askConfirm("¿Eliminar este registro?",()=>{
      if(type==="facturas"){state.pagos=state.pagos.filter(p=>p.facturaId!==id);state.ventas.forEach(v=>{if(v.facturaId===id){v.facturaId=null;v.estatus="abierta";}});}
      if(type==="ventas"){state.cotizaciones.forEach(c=>{if(c.ventaId===id)c.ventaId=null;});state.facturas.forEach(f=>{if(f.ventaId===id)f.ventaId=null;});}
      if(type==="cotizaciones")state.proveedores.forEach(p=>{if(Array.isArray(p.cotizadaEn))p.cotizadaEn=p.cotizadaEn.filter(x=>x!==id);});
      if(type==="proveedores"){state.cotizaciones.forEach(c=>{if(Array.isArray(c.origenProveedorIds))c.origenProveedorIds=c.origenProveedorIds.filter(x=>x!==id);});
        ui.provSel=(ui.provSel||[]).filter(x=>x!==id);}
      state[type]=state[type].filter(x=>x.id!==id);
      const pull=arr=>Array.isArray(arr)?arr.filter(x=>x!==id):arr;
      state.proyectos.forEach(p=>{if(type==="cotizaciones")p.cotIds=pull(p.cotIds);if(type==="ventas")p.ventaIds=pull(p.ventaIds);if(type==="ordenes")p.ordenIds=pull(p.ordenIds);if(type==="facturas")p.facturaIds=pull(p.facturaIds);});
      persist();render();toast("Registro eliminado");});}
    else if(a==="del-pago"){askConfirm("¿Eliminar el pago? El saldo se restituye a la factura.",()=>{state.pagos=state.pagos.filter(x=>x.id!==id);persist();render();toast("Pago eliminado");});}
    else if(a==="config"){openForm("config");}
    else if(a==="cierre-guardar"){openForm("cierre");}
    else if(a==="cierre-restaurar"){const s=snaps.find(x=>x.id===id);if(!s)return;askConfirm("¿Regresar a «"+s.nombre+"»? Se reemplazarán tus datos actuales por los de ese cierre.",()=>{state=JSON.parse(JSON.stringify(s.data));(function(){const pm=state.pagos.map(p=>monthKey(p.fecha)).sort();ui.contaMonth=pm.length?pm[pm.length-1]:monthKey(todayStr());})();persist();render();toast("Datos restaurados del cierre");},{ok:"Regresar",danger:false});}
    else if(a==="cierre-eliminar"){askConfirm("¿Eliminar este cierre guardado?",()=>{snaps=snaps.filter(x=>x.id!==id);saveSnaps();render();toast("Cierre eliminado");});}
    else if(a==="print"){const type=b.dataset.type;const arr={cot:state.cotizaciones,fac:state.facturas,oc:state.ordenes,ov:state.ventas}[type];const r=arr.find(x=>x.id===id);if(!r)return;
      const spec=type==="cot"?specCotizacion(r):type==="fac"?specFactura(r):type==="oc"?specOrden(r):specVenta(r);
      const cliRec=type==="oc"?null:state.clientes.find(x=>x.nombre&&spec.party&&x.nombre.toLowerCase()===String(spec.party).toLowerCase());
      openDocModal(spec.kind+" "+spec.folio,docHTML(spec),()=>salesPDF(spec),spec.filename,cliRec?cliRec.emails:"");}
    else if(a==="report"){openReport(b.dataset.kind);}
  });

  /* ---------- arranque: carga desde Google Sheets ---------- */
  function boot(){
    render();
    google.script.run
      .withSuccessHandler(res=>{
        try{const d=JSON.parse(res||"{}");
          state=normalize(d.state);
          snaps=Array.isArray(d.snaps)?d.snaps:[];
          const pm=state.pagos.map(p=>monthKey(p.fecha)).filter(Boolean).sort();
          ui.contaMonth=pm.length?pm[pm.length-1]:monthKey(todayStr());
        }catch(e){}
        render();setSyncState("saved");
        if(!state.cotizaciones.length&&!state.facturas.length&&!state.clientes.length)
          toast("Base vacía: usa «Datos de ejemplo» para empezar");
      })
      .withFailureHandler(err=>{toast("No se pudo cargar la base: "+(err&&err.message?err.message:"error"));setSyncState("error");})
      .getState();
  }
  boot();
})();

window.FULCRUM_JS_OK=true;
</script>
