<style>

  body { -webkit-tap-highlight-color: transparent; }

     golpe con el login y los datos encimados. Definirla aquí, en la hoja que

  .hidden { display: none !important; }

  }

    background: #1e293b;
    border-color: rgba(255, 255, 255, .08);
