<style>
  :root {
    --ground: #F1F5F3;
    --surface: #FFFFFF;
    --surface-2: #E6ECE9;
    --ink: #131C1A;
    --ink-2: #43524D;
    --ink-3: #6D807A;
    --rule: #D2DCD7;
    --rule-fuerte: #B7C6C0;
    --acento: #0E6F5C;
    --acento-suave: #D8EBE5;
    --alerta: #9C5711;
    --alerta-suave: #F5E6D0;
    --malo: #9E332A;
    --malo-suave: #F6DFDC;
    --bueno: #2C6E3C;
    --bueno-suave: #DCEBDF;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .oculto { display: none !important; }

  .cargando {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.08em;
  }

  header.barra {
    background: var(--surface);
    border-bottom: 1px solid var(--rule-fuerte);
    padding: 14px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: baseline;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header.barra h1 {
    margin: 0;
    font-size: 16px;
    letter-spacing: -0.01em;
  }
  header.barra .quien {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-3);
  }
  .insignia {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--acento-suave);
    color: var(--acento);
    margin-left: 6px;
  }

  nav.tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    padding: 0 12px;
  }
  nav.tabs button {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 11px 13px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-3);
    cursor: pointer;
    white-space: nowrap;
  }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button.activo { color: var(--acento); border-bottom-color: var(--acento); }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  h2.titulo {
    font-size: 20px;
    margin: 0 0 4px;
    letter-spacing: -0.015em;
  }
  p.sub {
    margin: 0 0 18px;
    color: var(--ink-2);
    font-size: 14px;
  }
  h3 {
    font-size: 15px;
    margin: 26px 0 10px;
  }

  .tarjeta {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .tarjeta-cab {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .tarjeta-cab h3 { margin: 0; font-size: 16px; }

  .etiqueta {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    background: var(--surface-2);
    color: var(--ink-3);
    white-space: nowrap;
  }
  .etiqueta.ok { background: var(--bueno-suave); color: var(--bueno); }
  .etiqueta.aviso { background: var(--alerta-suave); color: var(--alerta); }
  .etiqueta.malo { background: var(--malo-suave); color: var(--malo); }
  .etiqueta.acento { background: var(--acento-suave); color: var(--acento); }

  .platillos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
    margin: 10px 0 4px;
  }
  .platillo {
    border: 1px solid var(--rule);
    border-radius: 5px;
    background: var(--surface);
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    text-align: left;
    padding: 0;
    font: inherit;
    color: inherit;
  }
  .platillo:hover { border-color: var(--rule-fuerte); }
  .platillo.elegido { border-color: var(--acento); box-shadow: inset 0 0 0 1px var(--acento); }
  .platillo.agotado { opacity: 0.5; cursor: not-allowed; }
  .platillo img {
    width: 100%;
    height: 110px;
    object-fit: cover;
    display: block;
    background: var(--surface-2);
  }
  .platillo .cuerpo { padding: 9px 11px 11px; }
  .platillo b { display: block; font-size: 14px; }
  .platillo span { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
  .platillo .precio {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--acento);
    margin-top: 5px;
  }

  .fichas { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0; }
  .ficha {
    border: 1px solid var(--rule);
    border-radius: 20px;
    background: var(--surface);
    padding: 6px 13px;
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
  }
  .ficha.elegido { border-color: var(--acento); background: var(--acento-suave); color: var(--acento); }
  .ficha:disabled { opacity: 0.45; cursor: not-allowed; }

  button.accion {
    background: var(--acento);
    color: #fff;
    border: 1px solid var(--acento);
    border-radius: 5px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.accion:hover { filter: brightness(1.08); }
  button.accion:disabled { opacity: 0.5; cursor: not-allowed; }
  button.suave {
    background: var(--surface);
    color: var(--ink-2);
    border: 1px solid var(--rule-fuerte);
    border-radius: 5px;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 13.5px;
    cursor: pointer;
  }
  button.suave:hover { border-color: var(--acento); color: var(--acento); }
  button.peligro { color: var(--malo); border-color: var(--malo-suave); }
  button.peligro:hover { border-color: var(--malo); color: var(--malo); }
  .botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  label.campo {
    display: block;
    margin: 12px 0 0;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  input, select, textarea {
    width: 100%;
    margin-top: 5px;
    padding: 9px 11px;
    border: 1px solid var(--rule-fuerte);
    border-radius: 5px;
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
  }
  textarea { min-height: 64px; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--acento);
    outline-offset: 1px;
    border-color: var(--acento);
  }
  .fila-campos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 0 14px;
  }
  label.checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 14px;
    text-transform: none;
    letter-spacing: 0;
    font-family: inherit;
    color: var(--ink);
  }
  label.checkbox input { width: auto; margin: 0; }

  .tabla-envoltura { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 13.5px; }
  th {
    text-align: left;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
    padding: 10px 12px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--rule-fuerte);
    white-space: nowrap;
  }
  td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }

  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .cifra { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; }
  .cifra b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .cifra span { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

  .nota {
    border-left: 3px solid var(--acento);
    background: var(--acento-suave);
    padding: 11px 14px;
    border-radius: 0 5px 5px 0;
    margin: 12px 0;
    font-size: 14px;
  }
  .nota.aviso { border-left-color: var(--alerta); background: var(--alerta-suave); }
  .nota.malo { border-left-color: var(--malo); background: var(--malo-suave); }

  #aviso {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 12px 18px;
    border-radius: 6px;
    font-size: 14px;
    max-width: 90vw;
    z-index: 50;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  }
  #aviso.malo { background: var(--malo); }

  .vacio { color: var(--ink-3); font-size: 14px; padding: 18px 0; }

  pre.mensaje {
    white-space: pre-wrap;
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 12px;
    margin: 10px 0;
  }

  @media (max-width: 560px) {
    main { padding: 16px 12px 70px; }
    header.barra { padding: 12px 14px; }
    .platillo img { height: 92px; }
  }
</style>
