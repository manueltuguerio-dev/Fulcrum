<script>
var estado = {
  inicial: null,
  vista: 'comparar',
  filtros: { rutaId: '', mercancia: '', equipo: '', fecha: '', orden: 'puntaje',
             pesoPrecio: '', incluirVencidas: false, proveedorId: '' },
  comparacion: null,
  mejores: null,
  tarifas: null,
  filtroTarifas: { rutaId: '', proveedorId: '', texto: '', soloVigentes: false },
  borrador: null,
  importacion: { tipo: 'tarifas', texto: '', informe: null, crearFaltantes: true },
  usuarios: null
};

var LLAVE_TOKEN = 'tarifarios-tlterminals-token';

// El token llega en la liga personal (?t=…) y de ahí en adelante vive en el
// navegador. Es lo que identifica a quien entra con un correo externo.
var TOKEN = (function () {
  var deLaLiga = (typeof TOKEN_INICIAL === 'string') ? TOKEN_INICIAL : '';
  try {
    if (deLaLiga) {
      window.localStorage.setItem(LLAVE_TOKEN, deLaLiga);
      return deLaLiga;
    }
    return window.localStorage.getItem(LLAVE_TOKEN) || '';
  } catch (e) {
    return deLaLiga;
  }
})();

function olvidarToken() {
  try { window.localStorage.removeItem(LLAVE_TOKEN); } catch (e) { return; }
}

function $(id) { return document.getElementById(id); }

/**
 * Escribe dentro de un contenedor si todavía existe. Las respuestas del
 * servidor tardan, y para cuando llegan puede que ya te hayas cambiado de
 * pestaña: sin esto, la respuesta vieja truena contra una pantalla que ya no
 * está.
 * @return {boolean} false si el contenedor ya no existe.
 */
function pintarEn(id, html) {
  var nodo = $(id);
  if (!nodo) {
    return false;
  }
  nodo.innerHTML = html;
  return true;
}

function esc(texto) {
  return String(texto === null || texto === undefined ? '' : texto)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function moneda() {
  return (estado.inicial && estado.inicial.config && estado.inicial.config.monedaBase) || 'MXN';
}

function dinero(n) {
  var v = Number(n) || 0;
  var texto = Math.abs(v).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (v < 0 ? '-$' : '$') + texto;
}

function entero(n) {
  return (Number(n) || 0).toLocaleString('es-MX');
}

function llamar(nombre, args) {
  return new Promise(function (resolver, rechazar) {
    var corredor = google.script.run
      .withSuccessHandler(resolver)
      .withFailureHandler(rechazar);
    if (typeof corredor.ejecutar !== 'function') {
      rechazar(new Error('No pude comunicarme con el servidor.'));
      return;
    }
    corredor.ejecutar(TOKEN, nombre, args || []);
  });
}

var temporizadorAviso = null;
function avisar(mensaje, malo) {
  var caja = $('aviso');
  caja.textContent = mensaje;
  caja.className = malo ? 'malo' : '';
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(function () { caja.classList.add('oculto'); }, malo ? 8000 : 3500);
  caja.classList.remove('oculto');
}

function fallo(err) {
  avisar(err && err.message ? err.message : 'Algo salió mal.', true);
}

function enlazar(selector, evento, manejador) {
  var nodos = document.querySelectorAll(selector);
  for (var i = nodos.length - 1; i >= 0; i--) {
    nodos[i].addEventListener(evento, manejador);
  }
}

function valorDe(id) {
  var nodo = $(id);
  return nodo ? String(nodo.value).trim() : '';
}

function marcado(id) {
  var nodo = $(id);
  return nodo ? !!nodo.checked : false;
}

function esAdmin() {
  return estado.inicial && estado.inicial.usuario && estado.inicial.usuario.rol === 'admin';
}

/**
 * Descarga un archivo generado en el servidor. Si el navegador no deja bajar
 * desde aquí, se muestra el contenido para copiarlo a mano.
 */
function descargar(nombre, contenido) {
  try {
    var blob = new Blob(['\ufeff' + contenido], { type: 'text/csv;charset=utf-8;' });
    var liga = document.createElement('a');
    liga.href = URL.createObjectURL(blob);
    liga.download = nombre;
    document.body.appendChild(liga);
    liga.click();
    setTimeout(function () {
      URL.revokeObjectURL(liga.href);
      document.body.removeChild(liga);
    }, 1500);
    avisar('Descargando ' + nombre);
  } catch (e) {
    mostrarTexto(nombre, contenido);
  }
}

function mostrarTexto(nombre, contenido) {
  var caja = $('vista');
  var previo = document.createElement('div');
  previo.className = 'tarjeta';
  previo.innerHTML = '<div class="tarjeta-cab"><h3>' + esc(nombre) + '</h3>'
    + '<span class="apagado">Cópialo y pégalo en Excel.</span></div>'
    + '<textarea readonly style="min-height:220px">' + esc(contenido) + '</textarea>';
  caja.insertBefore(previo, caja.firstChild);
  previo.querySelector('textarea').select();
}

function tiempoTexto(horas) {
  var h = Number(horas) || 0;
  if (h <= 0) { return '—'; }
  if (h < 24) { return (Math.round(h * 10) / 10) + ' h'; }
  var dias = Math.floor(h / 24);
  var resto = Math.round((h - dias * 24) * 10) / 10;
  return dias + ' d' + (resto > 0 ? ' ' + resto + ' h' : '');
}

function hoyISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
    + '-' + String(d.getDate()).padStart(2, '0');
}

/* ------------------------------- arranque --------------------------------- */

function arrancar() {
  llamar('apiEstadoInicial').then(function (datos) {
    estado.inicial = datos;
    $('cargando').classList.add('oculto');
    $('app').classList.remove('oculto');

    if (!datos.sesion) {
      $('vista').innerHTML = '<h2 class="titulo">Necesitas tu liga personal</h2>'
        + '<div class="nota">Para entrar a los tarifarios abre la liga que te llegó '
        + 'por correo. Es personal y termina en <b>?t=</b> seguido de una clave.</div>'
        + '<p class="sub">Si no la tienes, pídesela al administrador.</p>';
      return;
    }
    if (datos.tokenInvalido) {
      olvidarToken();
      $('vista').innerHTML = '<h2 class="titulo">Tu liga ya no sirve</h2>'
        + '<div class="nota malo">La liga con la que entraste fue reemplazada o cancelada.</div>'
        + '<p class="sub">Pídele al administrador que te reenvíe una nueva.</p>';
      return;
    }
    if (!datos.registrado) {
      $('vista').innerHTML = '<h2 class="titulo">Aún no estás dado de alta</h2>'
        + (datos.email
            ? '<p class="sub">Tu correo <b>' + esc(datos.email) + '</b> no está registrado.</p>'
            : '<p class="sub">No traes una liga personal de acceso.</p>')
        + '<div class="nota">Pídele al administrador que te dé de alta.</div>';
      return;
    }
    if (datos.activo === false) {
      $('vista').innerHTML = '<div class="nota aviso">Tu cuenta está desactivada. '
        + 'Habla con el administrador.</div>';
      return;
    }
    estado.filtros.fecha = datos.hoy;
    pintarBarra();
    pintar();
  }).catch(function (err) {
    $('cargando').classList.add('oculto');
    $('app').classList.remove('oculto');
    $('vista').innerHTML = '<div class="nota malo">' + esc(err.message || err) + '</div>';
  });
}

function pintarBarra() {
  var u = estado.inicial.usuario;
  var empresa = (estado.inicial.config && estado.inicial.config.empresa) || 'TLTERMINALS';
  $('barra').innerHTML = '<h1>Tarifarios · ' + esc(empresa) + '</h1>'
    + '<div class="quien">' + esc(u.nombre)
    + (u.rol === 'admin' ? '<span class="insignia">admin</span>' : '')
    + ' <button class="suave chico" id="salir" style="margin-left:8px">Salir</button></div>';
  $('salir').addEventListener('click', function () {
    if (!confirm('¿Olvidar tu acceso en este dispositivo?')) { return; }
    olvidarToken();
    location.href = location.pathname;
  });

  var pestanas = [['comparar', 'Comparar'], ['mejores', 'Mejores opciones'],
                  ['tarifas', 'Tarifas']];
  if (esAdmin()) {
    pestanas = pestanas.concat([['proveedores', 'Proveedores'], ['rutas', 'Rutas'],
      ['catalogos', 'Catálogos'], ['datos', 'Importar y exportar'], ['ajustes', 'Ajustes']]);
  } else {
    pestanas.push(['datos', 'Exportar']);
  }

  $('tabs').innerHTML = pestanas.map(function (p) {
    return '<button data-vista="' + p[0] + '"'
      + (estado.vista === p[0] ? ' class="activo"' : '') + '>' + p[1] + '</button>';
  }).join('');
  enlazar('#tabs button', 'click', function () {
    estado.vista = this.getAttribute('data-vista');
    estado.borrador = null;
    pintarBarra();
    pintar();
  });
}

function pintar() {
  var mapa = {
    comparar: vistaComparar, mejores: vistaMejores, tarifas: vistaTarifas,
    proveedores: vistaProveedores, rutas: vistaRutas, catalogos: vistaCatalogos,
    datos: vistaDatos, ajustes: vistaAjustes
  };
  (mapa[estado.vista] || vistaComparar)();
}

function recargarInicial() {
  return llamar('apiEstadoInicial').then(function (datos) {
    estado.inicial = datos;
    return datos;
  });
}

/* -------------------------- controles de filtrado -------------------------- */

function opcionesRutas(seleccion, todas) {
  var lista = (estado.inicial.rutas || []).filter(function (r) {
    return todas || r.estado === 'activo';
  });
  return '<option value="">Todas las rutas</option>' + lista.map(function (r) {
    return '<option value="' + esc(r.id) + '"' + (seleccion === r.id ? ' selected' : '')
      + '>' + esc(r.nombre) + '</option>';
  }).join('');
}

function opcionesCatalogo(tipo, seleccion, etiquetaTodos) {
  var lista = (estado.inicial.catalogos[tipo] || []).filter(function (c) {
    return c.estado === 'activo' || c.clave === seleccion;
  });
  return '<option value="">' + esc(etiquetaTodos) + '</option>' + lista.map(function (c) {
    return '<option value="' + esc(c.clave) + '"' + (seleccion === c.clave ? ' selected' : '')
      + '>' + esc(c.nombre) + '</option>';
  }).join('');
}

function opcionesProveedores(seleccion, etiquetaTodos) {
  var lista = (estado.inicial.proveedores || []).filter(function (p) {
    return p.estado === 'activo' || p.id === seleccion;
  });
  return '<option value="">' + esc(etiquetaTodos) + '</option>' + lista.map(function (p) {
    return '<option value="' + esc(p.id) + '"' + (seleccion === p.id ? ' selected' : '')
      + '>' + esc(p.nombre) + '</option>';
  }).join('');
}

function cajaFiltros() {
  var f = estado.filtros;
  var pesoPrecio = f.pesoPrecio === '' ? Number(estado.inicial.config.pesoPrecio || 70)
    : Number(f.pesoPrecio);
  return '<div class="filtros">'
    + '<div class="fila-campos">'
    + '<label class="campo">Ruta<select id="f-ruta">' + opcionesRutas(f.rutaId) + '</select></label>'
    + '<label class="campo">Tipo de mercancía<select id="f-mercancia">'
    + opcionesCatalogo('mercancia', f.mercancia, 'Todas') + '</select></label>'
    + '<label class="campo">Tipo de equipo<select id="f-equipo">'
    + opcionesCatalogo('equipo', f.equipo, 'Todos') + '</select></label>'
    + '<label class="campo">Vigente al día<input type="date" id="f-fecha" value="'
    + esc(f.fecha || estado.inicial.hoy) + '" /></label>'
    + '<label class="campo">Ordenar por<select id="f-orden">'
    + '<option value="puntaje"' + (f.orden === 'puntaje' ? ' selected' : '') + '>Mejor opción (precio y tiempo)</option>'
    + '<option value="precio"' + (f.orden === 'precio' ? ' selected' : '') + '>Solo precio</option>'
    + '<option value="tiempo"' + (f.orden === 'tiempo' ? ' selected' : '') + '>Solo tiempo de entrega</option>'
    + '</select></label>'
    + '<label class="campo">Qué pesa más: precio <b id="f-peso-txt">' + pesoPrecio + ' %</b>'
    + ' / tiempo ' + (100 - pesoPrecio) + ' %'
    + '<input type="range" id="f-peso" min="0" max="100" step="5" value="' + pesoPrecio + '" /></label>'
    + '</div>'
    + '<label class="checkbox"><input type="checkbox" id="f-vencidas"'
    + (f.incluirVencidas ? ' checked' : '') + ' /> Incluir tarifas fuera de vigencia</label>'
    + '</div>';
}

function leerFiltros() {
  estado.filtros.rutaId = valorDe('f-ruta');
  estado.filtros.mercancia = valorDe('f-mercancia');
  estado.filtros.equipo = valorDe('f-equipo');
  estado.filtros.fecha = valorDe('f-fecha');
  estado.filtros.orden = valorDe('f-orden');
  estado.filtros.pesoPrecio = valorDe('f-peso');
  estado.filtros.incluirVencidas = marcado('f-vencidas');
}

function enlazarFiltros(alCambiar) {
  ['f-ruta', 'f-mercancia', 'f-equipo', 'f-fecha', 'f-orden', 'f-vencidas'].forEach(function (id) {
    var nodo = $(id);
    if (nodo) {
      nodo.addEventListener('change', function () { leerFiltros(); alCambiar(); });
    }
  });
  var peso = $('f-peso');
  if (peso) {
    peso.addEventListener('input', function () {
      $('f-peso-txt').textContent = peso.value + ' %';
    });
    peso.addEventListener('change', function () { leerFiltros(); alCambiar(); });
  }
}

/* ------------------------------- comparador -------------------------------- */

/**
 * Aviso de vigencias: las tarifas vencidas no aparecen en el comparador, así
 * que hay que decirlo en voz alta o nadie se entera de que hay que renegociar.
 */
function avisoVencimientos() {
  var r = estado.inicial.resumen;
  if (!r || (!r.vencidas && !r.porVencer)) {
    return '';
  }
  var partes = [];
  if (r.vencidas) {
    partes.push(r.vencidas + (r.vencidas === 1 ? ' tarifa vencida' : ' tarifas vencidas'));
  }
  if (r.porVencer) {
    partes.push(r.porVencer + (r.porVencer === 1 ? ' está por vencer' : ' están por vencer'));
  }
  return '<div class="nota aviso">Hay ' + esc(partes.join(' y '))
    + '. Las vencidas no entran al comparador: revísalas en la pestaña Tarifas.</div>';
}

function vistaComparar() {
  $('vista').innerHTML = '<h2 class="titulo">Comparar transportistas</h2>'
    + '<p class="sub">Elige la ruta y las características del viaje. Las opciones se '
    + 'acomodan de la mejor a la peor combinando precio y tiempo de entrega.</p>'
    + avisoVencimientos()
    + cajaFiltros()
    + '<div id="resultado"><div class="vacio">Consultando…</div></div>';
  enlazarFiltros(cargarComparacion);
  cargarComparacion();
}

function cargarComparacion() {
  pintarEn('resultado', '<div class="vacio">Consultando…</div>');
  llamar('apiComparar', [estado.filtros]).then(function (datos) {
    estado.comparacion = datos;
    pintarComparacion();
  }).catch(function (err) {
    pintarEn('resultado', '<div class="nota malo">' + esc(err.message || err) + '</div>');
  });
}

function pintarComparacion() {
  var datos = estado.comparacion;
  if (!$('resultado')) {
    return;
  }

  if (!datos.grupos.length) {
    pintarEn('resultado', '<div class="nota aviso">No hay tarifas que cumplan con eso.</div>'
      + descartadasTexto(datos.descartadas));
    return;
  }

  var encabezado = '<div class="cifras">'
    + cifra(datos.grupos.length, 'Combinaciones')
    + cifra(datos.total, 'Opciones comparadas')
    + cifra(datos.criterio.pesoPrecio + ' / ' + datos.criterio.pesoTiempo, 'Precio / tiempo')
    + cifra(datos.fecha, 'Vigente al')
    + '</div>';

  pintarEn('resultado', encabezado
    + datos.grupos.map(pintarGrupo).join('')
    + descartadasTexto(datos.descartadas));

  enlazar('button[data-historial]', 'click', function () {
    var partes = this.getAttribute('data-historial').split('|');
    verHistorial(partes[0], partes[1], partes[2]);
  });
}

function cifra(valor, etiqueta) {
  return '<div class="cifra"><b>' + esc(valor) + '</b><span>' + esc(etiqueta) + '</span></div>';
}

function pintarGrupo(g) {
  var maximo = g.costoMax || 1;
  return '<section class="grupo">'
    + '<header>'
    + '<div><b>' + esc(g.ruta) + '</b>'
    + '<div class="caracteristicas">' + esc(g.mercanciaNombre) + ' · ' + esc(g.equipoNombre)
    + (g.km ? ' · ' + entero(g.km) + ' km' : '') + '</div></div>'
    + '<div class="pila">'
    + '<span class="etiqueta">' + g.total + ' opciones · ' + g.proveedores + ' proveedores</span>'
    + (g.ahorro > 0 ? '<span class="etiqueta ok">Ahorro contra la peor ' + dinero(g.ahorro) + '</span>' : '')
    + '<button class="suave chico" data-historial="' + esc(g.rutaId) + '|'
    + esc(g.mercancia) + '|' + esc(g.equipo) + '">Historial</button>'
    + '</div></header>'
    + g.opciones.map(function (o) { return pintarOpcion(o, maximo); }).join('')
    + '</section>';
}

function pintarOpcion(o, maximo) {
  var ancho = Math.max(4, Math.round((o.costoTotal / maximo) * 100));
  var etiquetas = [];
  if (o.esMasBarata) { etiquetas.push('<span class="etiqueta ok">La más barata</span>'); }
  if (o.esMasRapida) { etiquetas.push('<span class="etiqueta acento">La más rápida</span>'); }
  if (o.vencida) { etiquetas.push('<span class="etiqueta malo">Vencida</span>'); }
  if (o.vigenciaHasta) { etiquetas.push('<span class="etiqueta">Vigente al ' + esc(o.vigenciaHasta) + '</span>'); }

  return '<div class="opcion' + (o.posicion === 1 ? ' ganadora' : '') + '">'
    + '<div class="lugar">' + o.posicion + '</div>'
    + '<div class="quien"><b>' + esc(o.proveedor) + '</b>'
    + '<div class="motivo">' + esc(o.motivo) + '</div>'
    + '<div class="pila" style="margin-top:6px">' + etiquetas.join('') + '</div></div>'
    + '<div class="cifras-opcion">'
    + '<div class="costo">' + dinero(o.costoTotal) + '</div>'
    + (o.sobreprecio > 0
        ? '<div class="contra">+' + dinero(o.sobreprecio) + ' (' + o.sobreprecioPct + ' %)</div>'
        : '<div class="contra" style="color:var(--bueno)">mejor precio</div>')
    + '<div class="tiempo">' + esc(o.tiempoTexto) + ' · puntaje ' + o.puntaje + '</div>'
    + '</div>'
    + '<div class="medidor"><i style="width:' + ancho + '%"></i></div>'
    + '<div class="detalle">tarifa ' + dinero(o.tarifa)
    + ' + combustible ' + o.combustiblePct + ' % (' + dinero(o.combustible) + ')'
    + ' + casetas ' + dinero(o.casetas)
    + (o.maniobras ? ' + maniobras ' + dinero(o.maniobras) : '')
    + (o.otros ? ' + otros ' + dinero(o.otros) : '')
    + ' · ' + esc(o.moneda)
    + (o.costoPorKm ? ' · ' + dinero(o.costoPorKm) + '/km' : '')
    + (o.capacidadTon ? ' · ' + o.capacidadTon + ' ton' : '')
    + '</div>'
    + '</div>';
}

function descartadasTexto(d) {
  if (!d) { return ''; }
  var partes = [];
  if (d.vencidas) { partes.push(d.vencidas + ' vencidas'); }
  if (d.sinVigencia) { partes.push(d.sinVigencia + ' fuera de la fecha consultada'); }
  if (d.inactivas) { partes.push(d.inactivas + ' desactivadas'); }
  if (d.proveedorInactivo) { partes.push(d.proveedorInactivo + ' de proveedores inactivos'); }
  if (d.capacidad) { partes.push(d.capacidad + ' sin la capacidad pedida'); }
  if (!partes.length) { return ''; }
  return '<p class="apagado">Se dejaron fuera: ' + esc(partes.join(', ')) + '.</p>';
}

function verHistorial(rutaId, mercancia, equipo) {
  llamar('apiHistorial', [rutaId, mercancia, equipo]).then(function (datos) {
    var filas = datos.historial.map(function (t) {
      return '<tr' + (t.estado !== 'activo' ? ' class="inactiva"' : '') + '>'
        + '<td>' + esc(t.proveedor) + '</td>'
        + '<td class="num">' + dinero(t.costoTotal) + '</td>'
        + '<td class="num">' + esc(t.tiempoTexto) + '</td>'
        + '<td class="mono">' + esc(t.vigenciaDesde || '—') + ' → ' + esc(t.vigenciaHasta || '—') + '</td>'
        + '<td>' + (t.vencida ? '<span class="etiqueta malo">vencida</span>'
            : '<span class="etiqueta ' + (t.estado === 'activo' ? 'ok' : '') + '">' + esc(t.estado) + '</span>') + '</td>'
        + '</tr>';
    }).join('');

    var caja = document.createElement('div');
    caja.className = 'tarjeta';
    caja.innerHTML = '<div class="tarjeta-cab"><h3>Historial · ' + esc(datos.ruta) + '</h3>'
      + '<span class="apagado">' + esc(datos.mercanciaNombre) + ' · ' + esc(datos.equipoNombre) + '</span></div>'
      + (filas
          ? '<div class="tabla-envoltura"><table><thead><tr><th>Proveedor</th>'
            + '<th class="num">Costo total</th><th class="num">Tiempo</th>'
            + '<th>Vigencia</th><th>Estado</th></tr></thead><tbody>' + filas + '</tbody></table></div>'
          : '<div class="vacio">Sin historial.</div>')
      + '<div class="botones"><button class="suave" id="cerrar-historial">Cerrar</button></div>';
    if (!$('resultado')) {
      return;
    }
    $('resultado').insertBefore(caja, $('resultado').firstChild);
    $('cerrar-historial').addEventListener('click', function () { caja.remove(); });
    caja.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }).catch(fallo);
}

/* ---------------------------- mejores opciones ----------------------------- */

function vistaMejores() {
  $('vista').innerHTML = '<h2 class="titulo">Mejores opciones</h2>'
    + '<p class="sub">Una línea por ruta y características, con quién conviene hoy, '
    + 'qué tan lejos quedó el segundo lugar y cuánto se ahorra contra la peor opción.</p>'
    + cajaFiltros()
    + '<div id="resultado"><div class="vacio">Consultando…</div></div>';
  enlazarFiltros(cargarMejores);
  cargarMejores();
}

function cargarMejores() {
  pintarEn('resultado', '<div class="vacio">Consultando…</div>');
  llamar('apiMejoresOpciones', [estado.filtros]).then(function (datos) {
    estado.mejores = datos;
    pintarMejores();
  }).catch(function (err) {
    pintarEn('resultado', '<div class="nota malo">' + esc(err.message || err) + '</div>');
  });
}

function pintarMejores() {
  var datos = estado.mejores;
  if (!$('resultado')) {
    return;
  }

  if (!datos.mejores.length) {
    pintarEn('resultado', '<div class="nota aviso">Todavía no hay tarifas vigentes que comparar.</div>'
      + descartadasTexto(datos.descartadas));
    return;
  }

  var filas = datos.mejores.map(function (m) {
    return '<tr>'
      + '<td><b>' + esc(m.ruta) + '</b>' + (m.km ? '<div class="apagado">' + entero(m.km) + ' km</div>' : '') + '</td>'
      + '<td>' + esc(m.mercanciaNombre) + '<div class="apagado">' + esc(m.equipoNombre) + '</div></td>'
      + '<td><b>' + esc(m.proveedor) + '</b><div class="apagado">' + esc(m.motivo) + '</div></td>'
      + '<td class="num">' + dinero(m.costoTotal)
      + (m.costoPorKm ? '<div class="apagado">' + dinero(m.costoPorKm) + '/km</div>' : '') + '</td>'
      + '<td class="num">' + esc(m.tiempoTexto) + '</td>'
      + '<td class="num">' + m.puntaje + '</td>'
      + '<td>' + (m.segundo ? esc(m.segundo) + '<div class="apagado">' + dinero(m.segundoCosto) + '</div>'
          : '<span class="etiqueta aviso">sin competencia</span>') + '</td>'
      + '<td class="num">' + (m.ventaja
          ? dinero(m.ventaja) + (m.ventaja < 0
              ? '<div class="apagado">la 2ª es más barata, pero más lenta</div>' : '')
          : '—') + '</td>'
      + '<td class="num">' + m.opciones + '</td>'
      + '<td class="num">' + (m.ahorro ? dinero(m.ahorro) : '—') + '</td>'
      + '</tr>';
  }).join('');

  pintarEn('resultado', '<div class="cifras">'
    + cifra(datos.resumen.combinaciones, 'Combinaciones')
    + cifra(datos.resumen.rutas, 'Rutas')
    + cifra(datos.resumen.opciones, 'Tarifas comparadas')
    + cifra(dinero(datos.resumen.ahorroTotal), 'Mejor contra peor')
    + cifra(datos.resumen.sinCompetencia, 'Sin competencia')
    + '</div>'
    + (datos.resumen.sinCompetencia
        ? '<div class="nota aviso">Hay ' + datos.resumen.sinCompetencia
          + (datos.resumen.sinCompetencia === 1
              ? ' combinación con un solo proveedor.' : ' combinaciones con un solo proveedor.')
          + ' Ahí no hay con qué comparar: conviene pedir cotización a alguien más.</div>'
        : '')
    + '<div class="tabla-envoltura"><table><thead><tr>'
    + '<th>Ruta</th><th>Características</th><th>Mejor opción</th>'
    + '<th class="num">Costo total</th><th class="num">Tiempo</th><th class="num">Puntaje</th>'
    + '<th>Segunda opción</th><th class="num">Diferencia</th><th class="num">Opciones</th>'
    + '<th class="num">Ahorro</th>'
    + '</tr></thead><tbody>' + filas + '</tbody></table></div>'
    + '<div class="botones">'
    + '<button class="suave" id="csv-mejores">Descargar CSV</button>'
    + '<button class="suave" id="csv-comparativo">Descargar comparativo completo</button>'
    + '<button class="accion" id="libro">Generar hoja de cálculo</button>'
    + '</div>'
    + descartadasTexto(datos.descartadas));

  $('csv-mejores').addEventListener('click', function () { bajarCsv('mejores'); });
  $('csv-comparativo').addEventListener('click', function () { bajarCsv('comparativo'); });
  $('libro').addEventListener('click', generarLibro);
}

function bajarCsv(tipo) {
  avisar('Preparando el archivo…');
  llamar('apiExportarCsv', [tipo, estado.filtros]).then(function (archivo) {
    descargar(archivo.nombre, archivo.contenido);
  }).catch(fallo);
}

function generarLibro() {
  avisar('Armando la hoja de cálculo… tarda unos segundos.');
  llamar('apiExportarLibro', [estado.filtros]).then(function (r) {
    if (!$('resultado')) {
      avisar('Lista la hoja de cálculo: ' + r.nombre);
      return;
    }
    var caja = document.createElement('div');
    caja.className = 'nota ok';
    caja.innerHTML = 'Listo: <a href="' + esc(r.url) + '" target="_blank">' + esc(r.nombre) + '</a>'
      + ' — quedó guardada en la carpeta de Drive de los tarifarios.';
    $('resultado').insertBefore(caja, $('resultado').firstChild);
  }).catch(fallo);
}

/* --------------------------------- tarifas --------------------------------- */

function vistaTarifas() {
  var f = estado.filtroTarifas;
  $('vista').innerHTML = '<h2 class="titulo">Tarifas</h2>'
    + '<p class="sub">Lo que cobra cada transportista por ruta, mercancía y equipo. '
    + 'El costo total ya trae combustible, casetas y maniobras, convertido a ' + esc(moneda()) + '.</p>'
    + '<div class="filtros"><div class="fila-campos">'
    + '<label class="campo">Ruta<select id="t-ruta">' + opcionesRutas(f.rutaId, true) + '</select></label>'
    + '<label class="campo">Proveedor<select id="t-proveedor">'
    + opcionesProveedores(f.proveedorId, 'Todos') + '</select></label>'
    + '<label class="campo">Buscar<input id="t-texto" value="' + esc(f.texto) + '" placeholder="proveedor, ruta, notas…" /></label>'
    + '</div>'
    + '<label class="checkbox"><input type="checkbox" id="t-vigentes"' + (f.soloVigentes ? ' checked' : '')
    + ' /> Solo las vigentes hoy</label></div>'
    + (esAdmin() ? '<div class="botones"><button class="accion" id="nueva-tarifa">Nueva tarifa</button></div>' : '')
    + '<div id="forma"></div>'
    + '<div id="lista"><div class="vacio">Consultando…</div></div>';

  ['t-ruta', 't-proveedor', 't-vigentes'].forEach(function (id) {
    $(id).addEventListener('change', leerFiltroTarifas);
  });
  $('t-texto').addEventListener('input', function () {
    clearTimeout(estado._tecleo);
    estado._tecleo = setTimeout(leerFiltroTarifas, 350);
  });
  if (esAdmin()) {
    $('nueva-tarifa').addEventListener('click', function () { formaTarifa(null); });
  }
  cargarTarifas();
}

function leerFiltroTarifas() {
  estado.filtroTarifas = {
    rutaId: valorDe('t-ruta'),
    proveedorId: valorDe('t-proveedor'),
    texto: valorDe('t-texto'),
    soloVigentes: marcado('t-vigentes')
  };
  cargarTarifas();
}

function cargarTarifas() {
  pintarEn('lista', '<div class="vacio">Consultando…</div>');
  llamar('apiTarifas', [estado.filtroTarifas]).then(function (datos) {
    estado.tarifas = datos;
    pintarTarifas();
  }).catch(function (err) {
    pintarEn('lista', '<div class="nota malo">' + esc(err.message || err) + '</div>');
  });
}

function pintarTarifas() {
  var datos = estado.tarifas;
  if (!$('lista')) {
    return;
  }
  if (!datos.tarifas.length) {
    pintarEn('lista', '<div class="vacio">No hay tarifas con esos filtros.</div>');
    return;
  }

  var filas = datos.tarifas.map(function (t) {
    return '<tr' + (t.estado !== 'activo' ? ' class="inactiva"' : '') + '>'
      + '<td><b>' + esc(t.proveedor) + '</b></td>'
      + '<td>' + esc(t.ruta) + '</td>'
      + '<td>' + esc(t.mercanciaNombre) + '<div class="apagado">' + esc(t.equipoNombre) + '</div></td>'
      + '<td class="num">' + dinero(t.tarifa) + '<div class="apagado">' + esc(t.moneda) + '</div></td>'
      + '<td class="num"><b>' + dinero(t.costoTotal) + '</b>'
      + (t.costoPorKm ? '<div class="apagado">' + dinero(t.costoPorKm) + '/km</div>' : '') + '</td>'
      + '<td class="num">' + tiempoTexto(t.tiempoHoras) + '</td>'
      + '<td class="mono">' + esc(t.vigenciaDesde || '—') + '<br>' + esc(t.vigenciaHasta || '—') + '</td>'
      + '<td>' + (t.vencida ? '<span class="etiqueta malo">vencida</span>'
          : '<span class="etiqueta ' + (t.estado === 'activo' ? 'ok' : '') + '">' + esc(t.estado) + '</span>') + '</td>'
      + (esAdmin()
          ? '<td class="acciones">'
            + '<button class="suave chico" data-editar="' + esc(t.id) + '">Editar</button>'
            + '<button class="suave chico" data-duplicar="' + esc(t.id) + '">Duplicar</button>'
            + '<button class="suave chico" data-estado="' + esc(t.id) + '" data-activo="'
            + (t.estado === 'activo' ? '0' : '1') + '">'
            + (t.estado === 'activo' ? 'Desactivar' : 'Activar') + '</button>'
            + '<button class="suave chico peligro" data-borrar="' + esc(t.id) + '">Borrar</button>'
            + '</td>'
          : '')
      + '</tr>';
  }).join('');

  pintarEn('lista', '<div class="tabla-envoltura"><table><thead><tr>'
    + '<th>Proveedor</th><th>Ruta</th><th>Características</th>'
    + '<th class="num">Tarifa</th><th class="num">Costo total</th><th class="num">Tiempo</th>'
    + '<th>Vigencia</th><th>Estado</th>' + (esAdmin() ? '<th></th>' : '')
    + '</tr></thead><tbody>' + filas + '</tbody></table></div>'
    + '<div class="botones"><button class="suave" id="csv-tarifas">Descargar CSV</button></div>');

  $('csv-tarifas').addEventListener('click', function () {
    llamar('apiExportarCsv', ['tarifas', estado.filtroTarifas]).then(function (a) {
      descargar(a.nombre, a.contenido);
    }).catch(fallo);
  });

  if (!esAdmin()) { return; }
  enlazar('button[data-editar]', 'click', function () {
    var id = this.getAttribute('data-editar');
    formaTarifa(estado.tarifas.tarifas.filter(function (t) { return t.id === id; })[0]);
  });
  enlazar('button[data-duplicar]', 'click', function () {
    llamar('apiDuplicarTarifa', [this.getAttribute('data-duplicar')]).then(function () {
      avisar('Copié la tarifa. Quedó inactiva y sin vigencia: edítala y actívala.');
      cargarTarifas();
    }).catch(fallo);
  });
  enlazar('button[data-estado]', 'click', function () {
    var activo = this.getAttribute('data-activo') === '1';
    llamar('apiCambiarEstadoTarifa', [this.getAttribute('data-estado'), activo])
      .then(cargarTarifas).catch(fallo);
  });
  enlazar('button[data-borrar]', 'click', function () {
    if (!confirm('¿Borrar esta tarifa? No se puede deshacer.')) { return; }
    llamar('apiBorrarTarifa', [this.getAttribute('data-borrar')]).then(function () {
      avisar('Tarifa borrada.');
      cargarTarifas();
    }).catch(fallo);
  });
}

function formaTarifa(t) {
  var d = t || {
    id: '', proveedorId: '', rutaId: '', mercancia: '', equipo: '', moneda: moneda(),
    tarifa: '', combustiblePct: '', casetas: '', maniobras: '', otros: '',
    tiempoHoras: '', capacidadTon: '', vigenciaDesde: hoyISO(), vigenciaHasta: '',
    estado: 'activo', notas: ''
  };

  $('forma').innerHTML = '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h3>' + (t ? 'Editar tarifa' : 'Nueva tarifa') + '</h3></div>'
    + '<div class="fila-campos">'
    + '<label class="campo">Proveedor<select id="x-proveedor">'
    + opcionesProveedores(d.proveedorId, 'Elige…') + '</select></label>'
    + '<label class="campo">Ruta<select id="x-ruta">'
    + opcionesRutas(d.rutaId, true).replace('Todas las rutas', 'Elige…') + '</select></label>'
    + '<label class="campo">Tipo de mercancía<select id="x-mercancia">'
    + opcionesCatalogo('mercancia', d.mercancia, 'Elige…') + '</select></label>'
    + '<label class="campo">Tipo de equipo<select id="x-equipo">'
    + opcionesCatalogo('equipo', d.equipo, 'Elige…') + '</select></label>'
    + '</div>'
    + '<div class="fila-campos">'
    + '<label class="campo">Moneda<select id="x-moneda">'
    + ['MXN', 'USD'].map(function (m) {
        return '<option value="' + m + '"' + (d.moneda === m ? ' selected' : '') + '>' + m + '</option>';
      }).join('') + '</select></label>'
    + campoNumero('x-tarifa', 'Tarifa base', d.tarifa)
    + campoNumero('x-combustible', 'Combustible %', d.combustiblePct)
    + campoNumero('x-casetas', 'Casetas', d.casetas)
    + campoNumero('x-maniobras', 'Maniobras', d.maniobras)
    + campoNumero('x-otros', 'Otros cargos', d.otros)
    + campoNumero('x-tiempo', 'Tiempo de entrega (horas)', d.tiempoHoras)
    + campoNumero('x-capacidad', 'Capacidad (ton)', d.capacidadTon)
    + '<label class="campo">Vigente desde<input type="date" id="x-desde" value="'
    + esc(d.vigenciaDesde) + '" /></label>'
    + '<label class="campo">Vigente hasta<input type="date" id="x-hasta" value="'
    + esc(d.vigenciaHasta) + '" /></label>'
    + '</div>'
    + '<label class="campo">Notas<textarea id="x-notas" style="min-height:52px">'
    + esc(d.notas) + '</textarea></label>'
    + '<label class="checkbox"><input type="checkbox" id="x-activo"'
    + (d.estado === 'activo' ? ' checked' : '') + ' /> Activa (entra al comparador)</label>'
    + '<div class="botones">'
    + '<button class="accion" id="x-guardar">Guardar</button>'
    + '<button class="suave" id="x-cancelar">Cancelar</button>'
    + '</div></div>';

  $('forma').scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('x-cancelar').addEventListener('click', function () { $('forma').innerHTML = ''; });
  $('x-guardar').addEventListener('click', function () {
    var datos = {
      id: d.id,
      proveedorId: valorDe('x-proveedor'),
      rutaId: valorDe('x-ruta'),
      mercancia: valorDe('x-mercancia'),
      equipo: valorDe('x-equipo'),
      moneda: valorDe('x-moneda'),
      tarifa: valorDe('x-tarifa'),
      combustiblePct: valorDe('x-combustible'),
      casetas: valorDe('x-casetas'),
      maniobras: valorDe('x-maniobras'),
      otros: valorDe('x-otros'),
      tiempoHoras: valorDe('x-tiempo'),
      capacidadTon: valorDe('x-capacidad'),
      vigenciaDesde: valorDe('x-desde'),
      vigenciaHasta: valorDe('x-hasta'),
      estado: marcado('x-activo') ? 'activo' : 'inactivo',
      notas: valorDe('x-notas')
    };
    this.disabled = true;
    llamar('apiGuardarTarifa', [datos]).then(function () {
      avisar('Tarifa guardada.');
      $('forma').innerHTML = '';
      cargarTarifas();
    }).catch(function (err) {
      fallo(err);
      var boton = $('x-guardar');
      if (boton) { boton.disabled = false; }
    });
  });
}

function campoNumero(id, etiqueta, valor) {
  return '<label class="campo">' + esc(etiqueta)
    + '<input type="number" step="any" id="' + id + '" value="' + esc(valor) + '" /></label>';
}

function vistaRutas() {
  $('vista').innerHTML = '<h2 class="titulo">Rutas</h2>'
    + '<p class="sub">Cada ruta es un par origen–destino. Los kilómetros son opcionales, '
    + 'pero con ellos el comparador calcula el costo por kilómetro.</p>'
    + '<div class="botones"><button class="accion" id="nueva-ruta">Dar de alta ruta</button></div>'
    + '<div id="forma"></div><div id="lista"><div class="vacio">Consultando…</div></div>';
  $('nueva-ruta').addEventListener('click', function () { formaRuta(null); });

}

function cargarRutas() {
  llamar('apiRutas').then(function (lista) {
    if (!$('lista')) {
      return;
    }

function enlazarImportar() {
  $('i-tipo').addEventListener('change', function () {

  });

  $('i-revisar').addEventListener('click', revisarImportacion);

/**
 * Lee el archivo como texto. Muchos CSV de por acá vienen en Windows-1252, así
 * que si aparecen caracteres rotos se vuelve a leer con esa codificación.
 */
function leerArchivo(archivo) {
  var lector = new FileReader();
  lector.onload = function () {
    var texto = String(lector.result || '');
    if (texto.indexOf('�') !== -1) {
      var otro = new FileReader();
      otro.onload = function () {
        $('i-texto').value = String(otro.result || '');
        avisar('Leí el archivo como Windows-1252 por los acentos.');
      };
      otro.readAsText(archivo, 'windows-1252');
      return;
    }
    $('i-texto').value = texto;
    avisar('Cargué ' + archivo.name + '. Ahora dale Revisar.');
  };
  lector.onerror = function () { avisar('No pude leer el archivo.', true); };
  lector.readAsText(archivo, 'UTF-8');
}

function revisarImportacion() {
  var texto = valorDe('i-texto');
  if (!texto) {
    avisar('Sube un archivo o pega el contenido primero.', true);
    return;
  }
  estado.importacion.tipo = valorDe('i-tipo');
  estado.importacion.texto = texto;
  estado.importacion.crearFaltantes = marcado('i-crear');
  pintarEn('i-informe', '<div class="vacio">Revisando…</div>');

  llamar('apiImportarRevisar', [estado.importacion.tipo, texto,
                                { crearFaltantes: estado.importacion.crearFaltantes }])
    .then(function (informe) {
      estado.importacion.informe = informe;
      pintarInforme(informe);
    }).catch(function (err) {
      pintarEn('i-informe', '<div class="nota malo">' + esc(err.message || err) + '</div>');
    });
}

function pintarInforme(informe) {
  if (!$('i-informe')) {
    return;
  }
  var r = informe.resumen;
  var nuevos = informe.nuevos || { proveedores: [], rutas: [], mercancias: [], equipos: [] };

  var filas = informe.filas.slice(0, 200).map(function (f) {
    var etiqueta = f.accion === 'error' ? '<span class="etiqueta malo">error</span>'
      : (f.accion === 'actualiza' ? '<span class="etiqueta aviso">actualiza</span>'
                                  : '<span class="etiqueta ok">alta</span>');
    return '<tr' + (f.accion === 'error' ? ' class="inactiva"' : '') + '>'
      + '<td class="num mono">' + f.n + '</td>'
      + '<td>' + etiqueta + '</td>'
      + '<td>' + esc(f.resumen) + '</td>'
      + '<td>' + (f.problemas.length ? esc(f.problemas.join(' ')) : '') + '</td>'
      + '</tr>';
  }).join('');

  var listaNuevos = [];
  if (nuevos.proveedores.length) { listaNuevos.push(nuevos.proveedores.length + ' proveedores'); }
  if (nuevos.rutas.length) { listaNuevos.push(nuevos.rutas.length + ' rutas'); }
  if (nuevos.mercancias.length) { listaNuevos.push(nuevos.mercancias.length + ' tipos de mercancía'); }
  if (nuevos.equipos.length) { listaNuevos.push(nuevos.equipos.length + ' tipos de equipo'); }

  pintarEn('i-informe', '<h3>Esto es lo que va a pasar</h3>'
    + '<div class="cifras">'
    + cifra(r.total, 'Renglones')
    + cifra(r.altas, 'Altas')
    + cifra(r.actualizaciones, 'Actualizaciones')
    + cifra(r.errores, 'Con problemas')
    + '</div>'
    + '<p class="apagado">Separador: ' + esc(informe.delimitador)
    + ' · Columnas reconocidas: ' + esc(informe.reconocidas.join(', ') || 'ninguna')
    + (informe.ignoradas.length ? ' · Ignoradas: ' + esc(informe.ignoradas.join(', ')) : '') + '</p>'
    + (listaNuevos.length
        ? '<div class="nota">Se darán de alta ' + esc(listaNuevos.join(', ')) + '.</div>' : '')
    + (r.errores
        ? '<div class="nota aviso">' + r.errores + ' renglones traen problemas. Si importas '
          + 'de todos modos, esos se saltan y el resto entra.</div>' : '')
    + '<div class="tabla-envoltura"><table><thead><tr>'
    + '<th class="num">#</th><th>Acción</th><th>Renglón</th><th>Problemas</th>'
    + '</tr></thead><tbody>' + filas + '</tbody></table></div>'
    + (informe.filas.length > 200
        ? '<p class="apagado">Muestro los primeros 200 de ' + informe.filas.length + '.</p>' : '')
    + '<div class="botones">'
    + '<button class="accion" id="i-aplicar">Importar ' + (r.total - r.errores) + ' renglones</button>'
    + '<button class="suave" id="i-descartar">Descartar</button>'
    + '</div>');

  $('i-descartar').addEventListener('click', function () {
    estado.importacion.informe = null;
    $('i-informe').innerHTML = '';
  });
  $('i-aplicar').addEventListener('click', aplicarImportacion);
}

function aplicarImportacion() {
  var imp = estado.importacion;
  var boton = $('i-aplicar');
  boton.disabled = true;
  boton.textContent = 'Importando…';

  llamar('apiImportarAplicar', [imp.tipo, imp.texto, { crearFaltantes: imp.crearFaltantes }])
    .then(function (r) {
      var partes = [r.altas + ' altas', r.actualizaciones + ' actualizaciones'];
      if (r.omitidas) { partes.push(r.omitidas + ' omitidas por problemas'); }
      if (r.sinReferencia) { partes.push(r.sinReferencia + ' sin proveedor o ruta'); }
      avisar('Listo: ' + partes.join(', ') + '.');
      if ($('i-texto')) { $('i-texto').value = ''; }
      estado.importacion.texto = '';
      estado.importacion.informe = null;
      pintarEn('i-informe', '<div class="nota ok">Importación aplicada: '
        + esc(partes.join(', ')) + '.'
        + (r.nuevos ? ' Se dieron de alta ' + r.nuevos.proveedores + ' proveedores, '
            + r.nuevos.rutas + ' rutas y ' + r.nuevos.catalogos + ' tipos nuevos.' : '')
        + '</div>');
      recargarInicial();
    }).catch(function (err) {
      fallo(err);
      var b = $('i-aplicar');
      if (b) { b.disabled = false; b.textContent = 'Importar'; }
    });
}

        + esc(u.rol) + '</span></td>'
        + '<td><span class="etiqueta ' + (u.estado === 'activo' ? 'ok' : '') + '">'
        + esc(u.estado) + '</span></td>'
        + '<td class="acciones">'
        + '<button class="suave chico" data-editar="' + esc(u.id) + '">Editar</button>'
        + '<button class="suave chico" data-liga="' + esc(u.id) + '">Liga nueva</button>'
        + '<button class="suave chico peligro" data-borrar="' + esc(u.id) + '">Borrar</button>'
        + '</td></tr>';
    }).join('');

    pintarEn('lista-usuarios', '<div class="tabla-envoltura"><table><thead><tr>'
      + '<th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th>'
      + '</tr></thead><tbody>' + filas + '</tbody></table></div>'
      + '<p class="apagado">Quien tenga correo del mismo dominio entra con su cuenta de '
      + 'Google. Para correos externos usa "Liga nueva" y mándasela.</p>'
      + '<div class="botones"><button class="suave" id="nuevo-usuario">Dar de alta usuario</button></div>');

    $('nuevo-usuario').addEventListener('click', function () { formaUsuario(null); });
    enlazar('button[data-editar]', 'click', function () {
      var id = this.getAttribute('data-editar');
      formaUsuario(lista.filter(function (u) { return u.id === id; })[0]);
    });
    enlazar('button[data-liga]', 'click', function () {
      if (!confirm('La liga anterior deja de servir. ¿Generar una nueva?')) { return; }
      llamar('apiRegenerarLiga', [this.getAttribute('data-liga')]).then(function (liga) {
        mostrarTexto('Liga personal', liga);
        cargarUsuarios();
      }).catch(fallo);
    });
    enlazar('button[data-borrar]', 'click', function () {
      if (!confirm('¿Quitarle el acceso a esta persona?')) { return; }
      llamar('apiBorrarUsuario', [this.getAttribute('data-borrar')]).then(function () {
        avisar('Usuario borrado.');
        cargarUsuarios();
      }).catch(fallo);
    });
  }).catch(function (err) {
    pintarEn('lista-usuarios', '<div class="nota malo">' + esc(err.message || err) + '</div>');
  });
}

function formaUsuario(u) {
  var d = u || { id: '', nombre: '', email: '', rol: 'consulta', estado: 'activo' };
  $('forma').innerHTML = '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h3>' + (u ? 'Editar usuario' : 'Nuevo usuario') + '</h3></div>'
    + '<div class="fila-campos">'
    + campoTexto('u-nombre', 'Nombre', d.nombre)
    + campoTexto('u-email', 'Correo', d.email)
    + '<label class="campo">Rol<select id="u-rol">'
    + '<option value="consulta"' + (d.rol === 'consulta' ? ' selected' : '') + '>Consulta</option>'
    + '<option value="admin"' + (d.rol === 'admin' ? ' selected' : '') + '>Administrador</option>'
    + '</select></label>'
    + '</div>'
    + '<label class="checkbox"><input type="checkbox" id="u-activo"'
    + (d.estado === 'activo' ? ' checked' : '') + ' /> Activo</label>'
    + (d.liga ? '<p class="apagado mono">' + esc(d.liga) + '</p>' : '')
    + '<div class="botones">'
    + '<button class="accion" id="u-guardar">Guardar</button>'
    + '<button class="suave" id="u-cancelar">Cancelar</button>'
    + '</div></div>';

  $('forma').scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('u-cancelar').addEventListener('click', function () { $('forma').innerHTML = ''; });
  $('u-guardar').addEventListener('click', function () {
    var datos = {
      id: d.id, nombre: valorDe('u-nombre'), email: valorDe('u-email'),
      rol: valorDe('u-rol'), estado: marcado('u-activo') ? 'activo' : 'inactivo'
    };
    this.disabled = true;
    llamar('apiGuardarUsuario', [datos]).then(function () {
      avisar('Usuario guardado.');
      $('forma').innerHTML = '';
      cargarUsuarios();
    }).catch(function (err) {
      fallo(err);
      var b = $('u-guardar');
      if (b) { b.disabled = false; }
    });
  });
}

arrancar();
</script>
